# Hazır özel paketleri (ör. tek el OLL/PLL) Firebase'e yazar. Atama yönetim panelinden yapılır.
name: Hazır paketleri yaz
on:
  push:
    branches: [main]
    paths: [".github/push/packs-seed.mjs"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: .github/push/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: .github/push
      - run: node packs-seed.mjs
        working-directory: .github/push
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
