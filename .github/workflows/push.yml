name: Bildirim gönder (Web Push) + hesap temizliği
# Site statik olduğu için telefon/arka plan bildirimlerini bu iş gönderir.
# Gerekli gizli anahtarlar (Settings → Secrets and variables → Actions):
#   FIREBASE_SERVICE_ACCOUNT : Firebase hizmet hesabı JSON'u
#   VAPID_PRIVATE_KEY        : Web Push özel anahtarı
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
concurrency:
  group: web-push
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/push
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: .github/push/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: .github/push
      - name: Silinen hesapları kaldır
        run: node cleanup.mjs
        working-directory: .github/push
        continue-on-error: true
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Ana sayfa kullanıcı sayısı
        run: node stats.mjs
        working-directory: .github/push
        continue-on-error: true
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - run: node send.mjs
        working-directory: .github/push
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
