<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#1e0b4b">
<title>RA ID · Küp Arena</title>
<link rel="icon" href="/img/kup-arena/icon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800;900&display=swap" rel="stylesheet">
<!--
  Küp Arena oyunu içinden açılan, yalnız RA ID (Google) girişi için sade sayfa.
  Site menüsü, alt bar, reklam, duyuru/bildirim pencereleri, analiz ve siteye giden bağlantı yok.
  ?donus doğrulaması ve kuparena://baglan?gid=… dönüşü js/kup-arena-baglan.js içinde.
-->
<style>
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px 16px;
    font-family: Inter, system-ui, sans-serif; color: #f5f3ff;
    background: radial-gradient(120% 90% at 50% 0%, #4c1d95 0%, #2a0f6b 45%, #140733 100%); }
.kb { width: min(400px, 100%); text-align: center; }
.kb-head { display: flex; flex-direction: column; align-items: center; gap: 10px; margin-bottom: 22px; user-select: none; pointer-events: none; }
.kb-head img { width: 76px; height: 76px; border-radius: 20px; box-shadow: 0 10px 26px rgba(0, 0, 0, .35); }
.kb-tag { font: 900 11px Inter, sans-serif; letter-spacing: 1.4px; color: #fde047; }
.kb-head h1 { margin: 0; font: 900 26px Inter, sans-serif; color: #fff; }
.kb-head p { margin: 0; font-size: 14.5px; line-height: 1.5; color: #d7ccff; }
.kb-btn { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; padding: 15px 16px; border-radius: 16px; border: 0;
    cursor: pointer; font: 900 16px Inter, sans-serif; text-decoration: none; -webkit-tap-highlight-color: transparent; }
.kb-btn[hidden] { display: none; }
.kb-g { background: #fff; color: #1f2937; box-shadow: 0 6px 18px rgba(0, 0, 0, .25); }
.kb-g:disabled { opacity: .6; cursor: default; }
.kb-back { margin-top: 10px; background: #facc15; color: #2a1458; box-shadow: 0 6px 18px rgba(250, 204, 21, .3); }
.kb-game { margin-top: 10px; background: rgba(255, 255, 255, .12); color: #fff; border: 1px solid rgba(255, 255, 255, .28); }
.kb-msg { min-height: 20px; margin-top: 14px; font-weight: 700; font-size: 14px; line-height: 1.45; color: #d7ccff; }
.kb-msg.bad { color: #fca5a5; } .kb-msg.ok { color: #86efac; }
</style>
</head>
<body>
<main class="kb">
    <div class="kb-head">
        <img src="/img/kup-arena/icon.png" alt="" width="76" height="76">
        <span class="kb-tag">KÜP ARENA</span>
        <h1>RA ID ile giriş</h1>
        <p id="kbSub">Google hesabınla giriş yap, oyun aynı hesapla açılsın.</p>
    </div>
    <button type="button" class="kb-btn kb-g" id="kbGo" hidden><svg width="22" height="22" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.1H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.6-.4-3.9z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.1H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.6-.4-3.9z"/></svg><span>Google ile giriş yap</span></button>
    <a class="kb-btn kb-back" id="kbBack" hidden>Küp Arena'ya dön</a>
    <a class="kb-btn kb-game" id="kbGame" hidden>Oyuna dön</a>
    <div class="kb-msg" id="kbMsg" role="status"></div>
</main>
<script src="/js/firebase-config.js?v=20270112"></script>
<script type="module" src="/js/kup-arena-baglan.js?v=20270112"></script>
</body>
</html>
