<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Küp Zamanlayıcı</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap');

:root{
  --bg:#0e0e11;
  --panel:#18181d;
  --panel2:#1f1f26;
  --border:#2a2a33;
  --text:#f1f1f4;
  --muted:#8c8c98;
  --white:#eceef0;
  --yellow:#f2c230;
  --orange:#ff7d3d;
  --red:#e4484f;
  --green:#3ed690;
  --blue:#4a90e2;
  --radius:14px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Space Grotesk',sans-serif;
  min-height:100vh;
  -webkit-tap-highlight-color:transparent;
  overscroll-behavior:none;
}
.wrap{
  max-width:1180px;
  margin:0 auto;
  padding:18px 20px 60px;
}

/* ---------- header ---------- */
header{
  display:flex;
  align-items:center;
  gap:16px;
  margin-bottom:18px;
  flex-wrap:wrap;
}
.logo{
  display:flex;
  align-items:center;
  gap:10px;
  font-weight:700;
  font-size:19px;
  letter-spacing:-0.02em;
  white-space:nowrap;
}
.logo .wheel{width:28px;height:28px;flex:none;}
.tabs{
  display:flex;
  gap:8px;
  overflow-x:auto;
  flex:1;
  padding:4px 2px;
  scrollbar-width:thin;
}
.tabs::-webkit-scrollbar{height:5px;}
.tabs::-webkit-scrollbar-thumb{background:var(--border);border-radius:10px;}
.tab{
  display:flex;
  align-items:center;
  gap:8px;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:999px;
  padding:6px 14px 6px 8px;
  font-size:13px;
  font-weight:500;
  color:var(--muted);
  white-space:nowrap;
  cursor:pointer;
  flex:none;
  transition:.15s;
  user-select:none;
}
.tab:hover{border-color:#3a3a45;color:var(--text);}
.tab.active{
  background:var(--panel2);
  border-color:#454552;
  color:var(--text);
}
.gear-btn{
  flex:none;
  width:38px;height:38px;
  border-radius:10px;
  background:var(--panel);
  border:1px solid var(--border);
  color:var(--muted);
  font-size:18px;
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;
}
.gear-btn:hover{color:var(--text);border-color:#3a3a45;}

/* cube-color-wheel icon, used as the whole app's visual signature */
.wheel{
  border-radius:6px;
  background:conic-gradient(from 90deg, var(--red), var(--orange), var(--yellow), var(--green), var(--blue), var(--white), var(--red));
}
.wheel.diamond{transform:rotate(45deg);border-radius:5px;width:20px;height:20px;}
.wheel.triangle{clip-path:polygon(50% 4%, 6% 96%, 94% 96%);border-radius:0;}
.wheel.pentagon{clip-path:polygon(50% 0%, 100% 38%, 82% 100%, 18% 100%, 0% 38%);border-radius:0;}
.wheel.hexish{clip-path:polygon(22% 0%, 78% 0%, 100% 50%, 78% 100%, 22% 100%, 0% 50%);border-radius:0;}
.tab .wheel{width:18px;height:18px;position:relative;}
.tab .nbadge{
  position:absolute;bottom:-3px;right:-4px;
  background:var(--bg);color:var(--text);
  font-size:8px;font-weight:700;
  border-radius:4px;padding:0 2px;
  line-height:1.3;
}

/* ---------- main layout ---------- */
main{
  display:grid;
  grid-template-columns:1fr 320px;
  gap:20px;
  align-items:start;
}
@media (max-width:880px){
  main{grid-template-columns:1fr;}
}

.card{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:18px;
}

/* scramble */
.scramble-head{
  display:flex;justify-content:space-between;align-items:center;
  margin-bottom:10px;
}
.scramble-head h3{
  margin:0;font-size:12px;text-transform:uppercase;letter-spacing:.08em;
  color:var(--muted);font-weight:600;
}
.icon-btn{
  background:transparent;border:1px solid var(--border);
  color:var(--muted);border-radius:8px;
  width:30px;height:30px;cursor:pointer;font-size:15px;
  display:flex;align-items:center;justify-content:center;
}
.icon-btn:hover{color:var(--text);border-color:#3a3a45;}
.chips{
  display:flex;flex-wrap:wrap;gap:6px;
  font-family:'JetBrains Mono',monospace;
  font-size:14px;
  min-height:28px;
}
.chip{
  border:1.5px solid #444;
  border-radius:7px;
  padding:2px 7px;
  font-weight:600;
}

/* timer zone */
.timer-zone{
  margin-top:16px;
  border-radius:var(--radius);
  border:1px solid var(--border);
  background:radial-gradient(ellipse at center, #17171c 0%, #101013 100%);
  min-height:260px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:10px;
  cursor:pointer;
  user-select:none;
  -webkit-touch-callout:none;
  -webkit-user-select:none;
  touch-action:none;
  transition:border-color .15s, box-shadow .15s;
  padding:20px;
  text-align:center;
}
.timer-zone.state-ready{border-color:var(--green);box-shadow:0 0 0 1px var(--green) inset, 0 0 24px -6px var(--green);}
.timer-zone.state-hold{border-color:var(--red);box-shadow:0 0 0 1px var(--red) inset;}
.timer-zone.state-running{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue) inset;}
.timer-zone.state-inspect{border-color:var(--yellow);}

.big-time{
  font-family:'JetBrains Mono',monospace;
  font-weight:700;
  font-size:clamp(52px, 9vw, 88px);
  letter-spacing:-0.02em;
  line-height:1;
}
.state-ready .big-time{color:var(--green);}
.state-hold .big-time{color:var(--red);}
.state-running .big-time{color:var(--blue);}
.inspect-num{
  font-family:'JetBrains Mono',monospace;
  font-size:22px;font-weight:700;color:var(--yellow);
}
.hint{
  color:var(--muted);
  font-size:13px;
}
.pending-pen{
  font-size:12px;color:var(--orange);font-weight:600;
}

/* stats */
.stats-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}
.stat-tile{
  background:var(--panel2);
  border:1px solid var(--border);
  border-radius:10px;
  padding:10px 12px;
}
.stat-tile .label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;}
.stat-tile .value{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:19px;margin-top:2px;}
.stat-tile.pb .value{color:var(--green);}

.side-title{
  font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);
  font-weight:600;margin:18px 0 10px;
  display:flex;justify-content:space-between;align-items:center;
}
.side-title button{
  background:none;border:none;color:var(--muted);font-size:12px;cursor:pointer;
  text-decoration:underline;padding:0;
}
.side-title button:hover{color:var(--red);}

.history{
  display:flex;flex-direction:column;gap:6px;
  max-height:420px;overflow-y:auto;
}
.history::-webkit-scrollbar{width:5px;}
.history::-webkit-scrollbar-thumb{background:var(--border);border-radius:10px;}
.solve-row{
  display:flex;align-items:center;gap:8px;
  background:var(--panel2);border:1px solid var(--border);
  border-radius:9px;padding:7px 9px;
  font-size:13px;
}
.solve-row .idx{color:var(--muted);width:24px;flex:none;font-size:12px;}
.solve-row .t{
  font-family:'JetBrains Mono',monospace;font-weight:700;flex:1;
  cursor:help;
}
.solve-row .t.dnf{color:var(--red);}
.solve-row .t.plus2{color:var(--orange);}
.solve-row .btns{display:flex;gap:4px;flex:none;}
.mini-btn{
  border:1px solid var(--border);background:transparent;color:var(--muted);
  border-radius:6px;font-size:11px;padding:3px 6px;cursor:pointer;font-weight:600;
  font-family:'Space Grotesk',sans-serif;
}
.mini-btn.on-plus2{background:var(--orange);border-color:var(--orange);color:#1a1005;}
.mini-btn.on-dnf{background:var(--red);border-color:var(--red);color:#1a0505;}
.mini-btn:hover{color:var(--text);}
.mini-btn.del:hover{background:var(--red);border-color:var(--red);color:#fff;}
.empty-hist{color:var(--muted);font-size:13px;padding:14px 4px;text-align:center;}

/* mobile history toggle */
.hist-toggle{display:none;}
@media (max-width:880px){
  .stats-grid{grid-template-columns:repeat(3,1fr);}
  .hist-toggle{
    display:block;width:100%;margin-top:16px;padding:10px;
    background:var(--panel2);border:1px solid var(--border);color:var(--text);
    border-radius:10px;font-family:'Space Grotesk',sans-serif;font-weight:600;
    cursor:pointer;
  }
  .history-wrap{display:none;margin-top:12px;}
  .history-wrap.open{display:block;}
}

/* modal */
.overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.6);
  display:none;align-items:center;justify-content:center;z-index:50;padding:16px;
}
.overlay.open{display:flex;}
.modal{
  background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
  padding:20px;width:100%;max-width:360px;
}
.modal h3{margin:0 0 14px;font-size:16px;}
.row-set{
  display:flex;justify-content:space-between;align-items:center;
  padding:10px 0;border-bottom:1px solid var(--border);
}
.row-set:last-of-type{border-bottom:none;}
.switch{
  position:relative;width:42px;height:24px;background:#333;border-radius:999px;cursor:pointer;flex:none;
  transition:.15s;
}
.switch.on{background:var(--green);}
.switch::after{
  content:'';position:absolute;top:2px;left:2px;width:20px;height:20px;background:#fff;border-radius:50%;
  transition:.15s;
}
.switch.on::after{left:20px;}
.modal-btns{display:flex;gap:10px;margin-top:16px;}
.btn{
  flex:1;padding:10px;border-radius:9px;border:1px solid var(--border);
  background:var(--panel2);color:var(--text);font-family:'Space Grotesk',sans-serif;
  font-weight:600;cursor:pointer;font-size:13px;
}
.btn.danger{background:var(--red);border-color:var(--red);color:#fff;}
.btn:hover{filter:brightness(1.1);}

.toast{
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
  background:var(--panel2);border:1px solid var(--border);color:var(--text);
  padding:10px 16px;border-radius:999px;font-size:13px;z-index:60;
  opacity:0;pointer-events:none;transition:opacity .2s, transform .2s;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="logo"><span class="wheel" style="width:28px;height:28px;"></span> Küp Zamanlayıcı</div>
    <div class="tabs" id="tabs"></div>
    <button class="gear-btn" id="gearBtn" title="Ayarlar">⚙</button>
  </header>

  <main>
    <div>
      <div class="card">
        <div class="scramble-head">
          <h3 id="cubeTitle">Karışım</h3>
          <button class="icon-btn" id="newScrambleBtn" title="Yeni karışım">⟳</button>
        </div>
        <div class="chips" id="scrambleChips"></div>
      </div>

      <div class="timer-zone" id="timerZone">
        <div class="big-time" id="bigTime">0.00</div>
        <div class="inspect-num" id="inspectNum" style="display:none;"></div>
        <div class="pending-pen" id="pendingPen" style="display:none;"></div>
        <div class="hint" id="hintText">Boşluk tuşuna basılı tut, bıraktığında zamanlayıcı başlar</div>
      </div>
    </div>

    <div>
      <div class="card">
        <div class="side-title">İstatistikler</div>
        <div class="stats-grid" id="statsGrid"></div>

        <div class="side-title">
          Geçmiş <span id="histCount"></span>
          <button id="clearAllBtn">tümünü sil</button>
        </div>
        <div class="history" id="historyList"></div>
      </div>
    </div>
  </main>

</div>

<div class="overlay" id="settingsOverlay">
  <div class="modal">
    <h3>Ayarlar</h3>
    <div class="row-set">
      <span>15 sn inceleme süresi</span>
      <div class="switch" id="inspectSwitch"></div>
    </div>
    <div class="modal-btns">
      <button class="btn" id="closeSettingsBtn">Kapat</button>
    </div>
  </div>
</div>

<div class="overlay" id="confirmOverlay">
  <div class="modal">
    <h3 id="confirmText">Emin misin?</h3>
    <div class="modal-btns">
      <button class="btn" id="confirmCancelBtn">Vazgeç</button>
      <button class="btn danger" id="confirmOkBtn">Evet, sil</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ================= CUBE TYPES ================= */
const CUBE_TYPES = [
  {id:'222', name:'2x2x2', cat:'nxn', n:2},
  {id:'333', name:'3x3x3', cat:'nxn', n:3},
  {id:'444', name:'4x4x4', cat:'nxn', n:4},
  {id:'555', name:'5x5x5', cat:'nxn', n:5},
  {id:'666', name:'6x6x6', cat:'nxn', n:6},
  {id:'777', name:'7x7x7', cat:'nxn', n:7},
  {id:'pyra', name:'Pyraminx', cat:'pyra'},
  {id:'skewb', name:'Skewb', cat:'skewb'},
  {id:'mega', name:'Megaminx', cat:'mega'},
  {id:'sq1', name:'Square-1', cat:'sq1'},
];
const FACE_COLOR = {U:'var(--white)',D:'var(--yellow)',L:'var(--orange)',R:'var(--red)',F:'var(--green)',B:'var(--blue)'};

function randInt(n){return Math.floor(Math.random()*n);}

function genNxN(n){
  const faces=['U','D','L','R','F','B'];
  const axis={U:0,D:0,L:1,R:1,F:2,B:2};
  const mods=['',"'",'2'];
  let length;
  if(n<=2) length=11; else if(n===3) length=20; else if(n===4) length=42;
  else if(n===5) length=60; else if(n===6) length=72; else length=84;
  const maxDepth = Math.floor(n/2);
  const moves=[]; let lastAxis=-1;
  for(let i=0;i<length;i++){
    let face, axIdx, tries=0;
    do{ face=faces[randInt(6)]; axIdx=axis[face]; tries++; } while(axIdx===lastAxis && tries<25);
    lastAxis=axIdx;
    let notation=face;
    if(n>=4 && maxDepth>=2 && Math.random()<0.45){
      const depth = 2+randInt(maxDepth-1);
      if(Math.random()<0.5 && depth<n){ notation = depth+face; }
      else { notation = (depth>2?depth:'')+face+'w'; }
    }
    notation += mods[randInt(3)];
    moves.push(notation);
  }
  return moves.join(' ');
}
function genPyraminx(){
  const faces=['U','L','R','B']; const mods=['',"'"];
  const moves=[]; let last=-1;
  for(let i=0;i<8;i++){ let f; do{f=randInt(4);}while(f===last); last=f; moves.push(faces[f]+mods[randInt(2)]); }
  ['u','l','r','b'].forEach(t=>{ if(Math.random()<0.75) moves.push(t+mods[randInt(2)]); });
  return moves.join(' ');
}
function genSkewb(){
  const faces=['U','L','R','B']; const mods=['',"'"];
  const moves=[]; let last=-1;
  for(let i=0;i<10;i++){ let f; do{f=randInt(4);}while(f===last); last=f; moves.push(faces[f]+mods[randInt(2)]); }
  return moves.join(' ');
}
function genMegaminx(){
  const moves=[];
  for(let round=0;round<7;round++){
    for(let i=0;i<5;i++){
      moves.push('R'+(Math.random()<0.5?'++':'--'));
      moves.push('D'+(Math.random()<0.5?'++':'--'));
    }
    moves.push(Math.random()<0.5?'U':"U'");
  }
  return moves.join(' ');
}
function genSquare1(){
  const parts=[];
  for(let i=0;i<12;i++){
    const x=randInt(12)-6, y=randInt(12)-6;
    parts.push(`(${x},${y})`);
    if(i<11) parts.push('/');
  }
  return parts.join(' ');
}
function generateScramble(typeId){
  const t=CUBE_TYPES.find(c=>c.id===typeId);
  if(t.cat==='nxn') return genNxN(t.n);
  if(t.cat==='pyra') return genPyraminx();
  if(t.cat==='skewb') return genSkewb();
  if(t.cat==='mega') return genMegaminx();
  if(t.cat==='sq1') return genSquare1();
  return '';
}

/* ================= STORAGE ================= */
async function loadSolves(cubeId){
  try{ const r = await window.storage.get('cube:'+cubeId+':times', false); return r ? JSON.parse(r.value) : []; }
  catch(e){ return []; }
}
async function saveSolves(cubeId, solves){
  try{ await window.storage.set('cube:'+cubeId+':times', JSON.stringify(solves), false); }
  catch(e){ console.error('save fail', e); }
}
async function loadSettings(){
  try{ const r = await window.storage.get('settings-v1', false); return r?JSON.parse(r.value):{inspection:false}; }
  catch(e){ return {inspection:false}; }
}
async function saveSettings(s){
  try{ await window.storage.set('settings-v1', JSON.stringify(s), false); } catch(e){ console.error(e); }
}
async function loadLastCube(){
  try{ const r = await window.storage.get('last-cube-id', false); return r?r.value:'333'; }
  catch(e){ return '333'; }
}
async function saveLastCube(id){
  try{ await window.storage.set('last-cube-id', id, false); } catch(e){}
}

/* ================= STATE ================= */
let currentCube = '333';
let solves = [];
let settings = {inspection:false};
let scramble = '';
let timerState = 'idle'; // idle | inspect | hold | ready | readyInspect | running
let holdTimeoutId = null;
let inspectIntervalId = null;
let inspectTimeoutId = null;
let inspectStart = 0;
let runStart = 0;
let runIntervalId = null;
let pendingPenalty = null;
const HOLD_MS = 300;

/* ================= HELPERS ================= */
function formatTime(ms){
  if(ms === Infinity || ms === null) return 'DNF';
  const cs = Math.round(ms/10);
  const m = Math.floor(cs/6000);
  const s = Math.floor((cs%6000)/100);
  const c = cs%100;
  if(m>0) return m+':'+String(s).padStart(2,'0')+'.'+String(c).padStart(2,'0');
  return s+'.'+String(c).padStart(2,'0');
}
function getFinal(solve){
  if(solve.penalty==='dnf') return Infinity;
  if(solve.penalty==='+2') return solve.raw+2000;
  return solve.raw;
}
function trimmedAverage(n, list){
  if(list.length < n) return null;
  const window = list.slice(0,n).map(getFinal);
  const trim = n<=12 ? 1 : Math.max(1, Math.round(n*0.05));
  const dnfCount = window.filter(t=>t===Infinity).length;
  if(dnfCount > trim) return Infinity;
  const sorted = [...window].sort((a,b)=>a-b);
  const trimmed = sorted.slice(trim, sorted.length-trim);
  const sum = trimmed.reduce((a,b)=>a+b,0);
  return sum/trimmed.length;
}
function computeStats(){
  const finals = solves.map(getFinal);
  const valid = finals.filter(f=>f!==Infinity);
  const pb = valid.length ? Math.min(...valid) : null;
  const mean = valid.length ? valid.reduce((a,b)=>a+b,0)/valid.length : null;
  return {
    pb,
    mean,
    ao5: trimmedAverage(5, solves),
    ao12: trimmedAverage(12, solves),
    ao50: trimmedAverage(50, solves),
    ao100: trimmedAverage(100, solves),
    count: solves.length
  };
}
function fmtStat(v){
  if(v===null || v===undefined) return '-';
  if(v===Infinity) return 'DNF';
  return formatTime(v);
}
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._id);
  showToast._id = setTimeout(()=>t.classList.remove('show'), 1800);
}

/* ================= RENDER ================= */
function shapeClassFor(type){
  if(type.cat==='nxn') return '';
  if(type.cat==='pyra') return 'triangle';
  if(type.cat==='skewb') return 'diamond';
  if(type.cat==='mega') return 'pentagon';
  if(type.cat==='sq1') return 'hexish';
  return '';
}
function renderTabs(){
  const tabs = document.getElementById('tabs');
  tabs.innerHTML = '';
  CUBE_TYPES.forEach(t=>{
    const el = document.createElement('div');
    el.className = 'tab' + (t.id===currentCube ? ' active':'');
    const shape = shapeClassFor(t);
    el.innerHTML = `<span class="wheel ${shape}" style="width:18px;height:18px;position:relative;">
      ${t.cat==='nxn' ? `<span class="nbadge">${t.n}</span>` : ''}
    </span>${t.name}`;
    el.addEventListener('click', ()=>switchCube(t.id));
    tabs.appendChild(el);
  });
}
function renderScramble(){
  document.getElementById('cubeTitle').textContent = 'Karışım · ' + CUBE_TYPES.find(c=>c.id===currentCube).name;
  const wrap = document.getElementById('scrambleChips');
  wrap.innerHTML = '';
  scramble.split(' ').forEach(tok=>{
    if(!tok) return;
    const m = tok.match(/[UDLRFB]/i);
    const color = m ? FACE_COLOR[m[0].toUpperCase()] : '#5a5a63';
    const span = document.createElement('span');
    span.className = 'chip';
    span.style.borderColor = color;
    span.style.color = color;
    span.textContent = tok;
    wrap.appendChild(span);
  });
}
function renderStats(){
  const s = computeStats();
  const tiles = [
    ['PB', fmtStat(s.pb), true],
    ['Ao5', fmtStat(s.ao5)],
    ['Ao12', fmtStat(s.ao12)],
    ['Ao50', fmtStat(s.ao50)],
    ['Ao100', fmtStat(s.ao100)],
    ['Ortalama', fmtStat(s.mean)],
    ['Çözüm', String(s.count)],
  ];
  const grid = document.getElementById('statsGrid');
  grid.innerHTML = tiles.map(([label,val,pb])=>`
    <div class="stat-tile ${pb?'pb':''}">
      <div class="label">${label}</div>
      <div class="value">${val}</div>
    </div>`).join('');
  document.getElementById('histCount').textContent = '('+solves.length+')';
}
function renderHistory(){
  const list = document.getElementById('historyList');
  if(!solves.length){
    list.innerHTML = '<div class="empty-hist">Henüz çözüm yok. Zamanlayıcıyı başlat!</div>';
    return;
  }
  list.innerHTML = solves.map((sv, i)=>{
    const idx = solves.length - i;
    const cls = sv.penalty==='dnf' ? 'dnf' : sv.penalty==='+2' ? 'plus2' : '';
    const timeText = sv.penalty==='dnf' ? 'DNF' : formatTime(getFinal(sv));
    const dateStr = new Date(sv.date).toLocaleString('tr-TR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
    return `<div class="solve-row">
      <div class="idx">${idx}.</div>
      <div class="t ${cls}" title="${sv.scramble} — ${dateStr}">${timeText}</div>
      <div class="btns">
        <button class="mini-btn ${sv.penalty==='+2'?'on-plus2':''}" data-act="plus2" data-id="${sv.id}">+2</button>
        <button class="mini-btn ${sv.penalty==='dnf'?'on-dnf':''}" data-act="dnf" data-id="${sv.id}">DNF</button>
        <button class="mini-btn del" data-act="del" data-id="${sv.id}">✕</button>
      </div>
    </div>`;
  }).join('');

  list.querySelectorAll('.mini-btn').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      e.stopPropagation();
      const id = btn.dataset.id;
      const act = btn.dataset.act;
      const sv = solves.find(x=>x.id===id);
      if(!sv) return;
      if(act==='del'){
        solves = solves.filter(x=>x.id!==id);
      } else if(act==='plus2'){
        sv.penalty = sv.penalty==='+2' ? 'ok' : '+2';
      } else if(act==='dnf'){
        sv.penalty = sv.penalty==='dnf' ? 'ok' : 'dnf';
      }
      saveSolves(currentCube, solves);
      renderStats();
      renderHistory();
    });
  });
}

/* ================= CUBE SWITCH ================= */
async function switchCube(id){
  currentCube = id;
  saveLastCube(id);
  resetToIdle();
  solves = await loadSolves(currentCube);
  renderTabs();
  newScramble();
  renderStats();
  renderHistory();
}
function newScramble(){
  scramble = generateScramble(currentCube);
  renderScramble();
}

/* ================= TIMER STATE MACHINE ================= */
const zone = document.getElementById('timerZone');
const bigTime = document.getElementById('bigTime');
const inspectNum = document.getElementById('inspectNum');
const hintText = document.getElementById('hintText');
const pendingPenEl = document.getElementById('pendingPen');

function setZoneClass(cls){
  zone.className = 'timer-zone' + (cls ? ' '+cls : '');
}
function resetToIdle(){
  clearTimeout(holdTimeoutId);
  clearInterval(inspectIntervalId);
  clearTimeout(inspectTimeoutId);
  clearInterval(runIntervalId);
  timerState = 'idle';
  pendingPenalty = null;
  bigTime.textContent = '0.00';
  inspectNum.style.display = 'none';
  pendingPenEl.style.display = 'none';
  hintText.textContent = isTouchDevice()
    ? 'Ekrana dokunup basılı tut, bıraktığında zamanlayıcı başlar'
    : 'Boşluk tuşuna basılı tut, bıraktığında zamanlayıcı başlar';
  setZoneClass('');
}
function isTouchDevice(){
  return 'ontouchstart' in window || navigator.maxTouchPoints > 0;
}

function startInspection(){
  timerState = 'inspect';
  inspectStart = Date.now();
  inspectNum.style.display = 'block';
  hintText.textContent = 'İnceleme... basılı tutup bırak';
  setZoneClass('state-inspect');
  inspectIntervalId = setInterval(()=>{
    const elapsed = (Date.now()-inspectStart)/1000;
    const remain = Math.max(0, 15-elapsed);
    inspectNum.textContent = remain.toFixed(1)+' sn';
    if(elapsed>15) inspectNum.style.color = elapsed>17 ? 'var(--red)' : 'var(--orange)';
  }, 100);
  inspectTimeoutId = setTimeout(()=>{
    if(timerState==='inspect'){
      showToast('İnceleme süresi doldu (17 sn)');
      resetToIdle();
    }
  }, 17000);
}

function armHold(){
  clearTimeout(holdTimeoutId);
  const priorState = timerState;
  if(priorState==='idle') { timerState='hold'; setZoneClass('state-hold'); hintText.textContent='Hazırlanıyor...'; }
  holdTimeoutId = setTimeout(()=>{
    if(timerState==='hold'){ timerState='ready'; setZoneClass('state-ready'); hintText.textContent='Bırak ve başlat!'; }
    else if(timerState==='inspect'){ timerState='readyInspect'; setZoneClass('state-ready'); hintText.textContent='Bırak ve başlat!'; }
  }, HOLD_MS);
}

function startStopwatch(){
  timerState = 'running';
  setZoneClass('state-running');
  hintText.textContent = 'Durdurmak için dokun / boşluk';
  runStart = Date.now();
  runIntervalId = setInterval(()=>{
    bigTime.textContent = formatTime(Date.now()-runStart);
  }, 30);
}

async function stopAndRecord(){
  clearInterval(runIntervalId);
  const raw = Date.now()-runStart;
  bigTime.textContent = formatTime(pendingPenalty==='+2' ? raw+2000 : raw);
  const solve = {
    id: Date.now()+'-'+Math.random().toString(36).slice(2,8),
    raw,
    penalty: pendingPenalty || 'ok',
    scramble,
    date: new Date().toISOString()
  };
  solves.unshift(solve);
  await saveSolves(currentCube, solves);
  renderStats();
  renderHistory();
  pendingPenalty = null;
  setTimeout(()=>{
    resetToIdle();
    newScramble();
  }, 600);
}

function engage(){
  if(timerState==='running'){
    stopAndRecord();
    return;
  }
  if(timerState==='idle'){
    if(settings.inspection){ startInspection(); }
    armHold();
  } else if(timerState==='inspect'){
    armHold();
  } else if(timerState==='hold'){
    armHold();
  }
}
function release(){
  clearTimeout(holdTimeoutId);
  if(timerState==='ready'){
    startStopwatch();
  } else if(timerState==='readyInspect'){
    const inspElapsed = Date.now()-inspectStart;
    clearInterval(inspectIntervalId);
    clearTimeout(inspectTimeoutId);
    if(inspElapsed > 17000){
      showToast('17 saniyeyi geçtin — DNF');
      resetToIdle();
      return;
    }
    pendingPenalty = inspElapsed>15000 ? '+2' : null;
    if(pendingPenalty){
      pendingPenEl.style.display='block';
      pendingPenEl.textContent = '+2 ceza uygulanacak';
    }
    startStopwatch();
  } else if(timerState==='hold'){
    timerState='idle';
    setZoneClass('');
    hintText.textContent = isTouchDevice() ? 'Ekrana dokunup basılı tut' : 'Boşluk tuşuna basılı tut';
  } else if(timerState==='inspect'){
    // released before hold threshold during inspection; keep inspecting
    hintText.textContent = 'İnceleme... basılı tutup bırak';
  }
}

/* keyboard */
document.addEventListener('keydown', (e)=>{
  if(e.code!=='Space') return;
  if(document.querySelector('.overlay.open')) return;
  e.preventDefault();
  if(e.repeat) return;
  engage();
});
document.addEventListener('keyup', (e)=>{
  if(e.code!=='Space') return;
  if(document.querySelector('.overlay.open')) return;
  e.preventDefault();
  release();
});

/* touch / mouse on the zone itself */
zone.addEventListener('touchstart', (e)=>{ e.preventDefault(); engage(); }, {passive:false});
zone.addEventListener('touchend', (e)=>{ e.preventDefault(); release(); }, {passive:false});
zone.addEventListener('mousedown', (e)=>{ engage(); });
zone.addEventListener('mouseup', (e)=>{ release(); });

/* ================= SETTINGS MODAL ================= */
const settingsOverlay = document.getElementById('settingsOverlay');
document.getElementById('gearBtn').addEventListener('click', ()=>settingsOverlay.classList.add('open'));
document.getElementById('closeSettingsBtn').addEventListener('click', ()=>settingsOverlay.classList.remove('open'));
const inspectSwitch = document.getElementById('inspectSwitch');
inspectSwitch.addEventListener('click', ()=>{
  settings.inspection = !settings.inspection;
  inspectSwitch.classList.toggle('on', settings.inspection);
  saveSettings(settings);
});

/* ================= CONFIRM MODAL (clear all) ================= */
const confirmOverlay = document.getElementById('confirmOverlay');
document.getElementById('clearAllBtn').addEventListener('click', ()=>{
  if(!solves.length){ showToast('Silinecek çözüm yok'); return; }
  document.getElementById('confirmText').textContent =
    CUBE_TYPES.find(c=>c.id===currentCube).name + ' için tüm çözümleri silmek istediğine emin misin?';
  confirmOverlay.classList.add('open');
});
document.getElementById('confirmCancelBtn').addEventListener('click', ()=>confirmOverlay.classList.remove('open'));
document.getElementById('confirmOkBtn').addEventListener('click', async ()=>{
  solves = [];
  await saveSolves(currentCube, solves);
  renderStats();
  renderHistory();
  confirmOverlay.classList.remove('open');
  showToast('Tüm çözümler silindi');
});

/* new scramble button */
document.getElementById('newScrambleBtn').addEventListener('click', newScramble);

/* ================= INIT ================= */
async function init(){
  settings = await loadSettings();
  inspectSwitch.classList.toggle('on', !!settings.inspection);
  currentCube = await loadLastCube();
  if(!CUBE_TYPES.find(c=>c.id===currentCube)) currentCube = '333';
  solves = await loadSolves(currentCube);
  renderTabs();
  newScramble();
  renderStats();
  renderHistory();
  resetToIdle();
}
init();
</script>
