<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Küp Zamanlayıcı — Rubik Academy</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
  --background:#f8fafc;
  --surface:#ffffff;
  --surface-soft:#f1f5f9;
  --primary:#2563eb;
  --primary-dark:#1d4ed8;
  --primary-light:#eff6ff;
  --text:#172033;
  --text-soft:#64748b;
  --border:#e2e8f0;
  --shadow:0 15px 40px rgba(15,23,42,.07);

  --c-u:#94a3b8;
  --c-d:#facc15;
  --c-l:#f97316;
  --c-r:#ef4444;
  --c-f:#22c55e;
  --c-b:#3b82f6;
  --c-br:#a855f7;
  --c-bl:#ec4899;
}
html.dark-mode{
  --background:#0f172a;
  --surface:#1e293b;
  --surface-soft:#334155;
  --text:#f8fafc;
  --text-soft:#cbd5e1;
  --border:#334155;
  --primary-light:#1e3a8a;
  --shadow:0 15px 40px rgba(0,0,0,.35);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Inter',sans-serif;
  background:var(--background);
  color:var(--text);
  min-height:100vh;
  -webkit-tap-highlight-color:transparent;
  overscroll-behavior:none;
  transition:background-color .3s, color .3s;
}
.wrap{max-width:1100px;margin:0 auto;padding:20px 20px 70px;}

/* ---------- header (site navbar style) ---------- */
.navbar{
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:14px 4px;margin-bottom:22px;
  border-bottom:1px solid var(--border);
  flex-wrap:wrap;
}
.nav-logo{display:flex;align-items:center;gap:12px;}
.nav-logo-mark{
  width:38px;height:38px;display:grid;
  grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);
  gap:2px;padding:4px;border-radius:10px;background:#1e293b;
  box-shadow:0 8px 18px rgba(15,23,42,.18);flex:none;
}
.nav-logo-mark div{border-radius:2px;background:#f8fafc;}
.nav-logo-mark div:nth-child(2),.nav-logo-mark div:nth-child(8){background:#ef4444;}
.nav-logo-mark div:nth-child(4),.nav-logo-mark div:nth-child(6){background:#22c55e;}
.nav-logo-mark div:nth-child(5){background:#3b82f6;}
.nav-logo-mark div:nth-child(1),.nav-logo-mark div:nth-child(9){background:#facc15;}
.nav-logo-text{font-size:17px;font-weight:800;letter-spacing:-.5px;}
.nav-logo-text span{display:block;font-size:11px;font-weight:600;color:var(--text-soft);letter-spacing:0;}

.nav-right{display:flex;align-items:center;gap:10px;}
.dark-mode-btn{
  border:none;background:var(--surface-soft);color:var(--text);
  width:42px;height:42px;border-radius:50%;font-size:19px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:.3s;
}
.dark-mode-btn:hover{transform:scale(1.08);}

/* cube selector button */
.cube-select-btn{
  display:flex;align-items:center;gap:10px;
  background:var(--surface);border:1px solid var(--border);
  padding:8px 14px 8px 8px;border-radius:14px;cursor:pointer;
  box-shadow:var(--shadow);font-family:'Inter',sans-serif;
}
.cube-select-btn:hover{border-color:var(--primary);}
.cube-select-btn .name{font-weight:700;font-size:14px;}
.cube-select-btn .chev{color:var(--text-soft);font-size:11px;margin-left:2px;}

/* wheel icon = the app's signature: an 8-colour cube wheel matching the shape of each puzzle */
.wheel{
  border-radius:7px;
  background:conic-gradient(from 90deg, var(--c-r), var(--c-l), var(--c-d), var(--c-f), var(--c-b), var(--c-br), var(--c-bl), var(--c-r));
  flex:none;position:relative;
}
.wheel.diamond{transform:rotate(45deg);border-radius:5px;}
.wheel.triangle{clip-path:polygon(50% 4%, 6% 96%, 94% 96%);border-radius:0;}
.wheel.pentagon{clip-path:polygon(50% 0%, 100% 38%, 82% 100%, 18% 100%, 0% 38%);border-radius:0;}
.wheel.hexish{clip-path:polygon(22% 0%, 78% 0%, 100% 50%, 78% 100%, 22% 100%, 0% 50%);border-radius:0;}
.wheel.octagon{clip-path:polygon(30% 0%,70% 0%,100% 30%,100% 70%,70% 100%,30% 100%,0% 70%,0% 30%);border-radius:0;}
.nbadge{
  position:absolute;bottom:-4px;right:-4px;background:var(--text);color:var(--background);
  font-size:8px;font-weight:800;border-radius:4px;padding:0 2px;line-height:1.3;
}

/* ---------- cube picker modal ---------- */
.overlay{
  position:fixed;inset:0;background:rgba(15,23,42,.55);
  display:none;align-items:flex-start;justify-content:center;z-index:80;
  padding:8vh 16px 16px;overflow-y:auto;
}
.overlay.open{display:flex;}
.picker-modal{
  background:var(--surface);border:1px solid var(--border);border-radius:22px;
  padding:22px;width:100%;max-width:640px;box-shadow:0 25px 60px rgba(15,23,42,.25);
}
.picker-modal h3{margin:0 0 16px;font-size:18px;font-weight:800;letter-spacing:-.3px;}
.picker-grid{
  display:grid;grid-template-columns:repeat(auto-fill, minmax(130px,1fr));gap:10px;
}
.picker-card{
  display:flex;flex-direction:column;align-items:center;gap:8px;
  padding:16px 10px;border-radius:16px;border:1.5px solid var(--border);
  background:var(--surface-soft);cursor:pointer;transition:.2s;
}
.picker-card:hover{border-color:var(--primary);transform:translateY(-3px);}
.picker-card.active{border-color:var(--primary);background:var(--primary-light);}
.picker-card .wheel{width:34px;height:34px;}
.picker-card .lbl{font-size:13px;font-weight:700;text-align:center;}
.picker-card .sub{font-size:10.5px;color:var(--text-soft);text-align:center;}
.picker-close{
  margin-top:18px;width:100%;padding:11px;border-radius:11px;border:1px solid var(--border);
  background:var(--surface-soft);color:var(--text);font-weight:700;cursor:pointer;font-family:'Inter',sans-serif;
}

/* ---------- main layout: tabbed views ---------- */
/* Desktop/tablet: compact, lives inline inside the navbar next to the logo */
.tabbar{
  display:flex;gap:4px;background:var(--surface-soft);border:1px solid var(--border);
  border-radius:14px;padding:4px;flex:none;
}
.tab-btn{
  flex:none;border:none;background:transparent;color:var(--text-soft);
  font-family:'Inter',sans-serif;font-weight:700;font-size:13.5px;
  padding:9px 15px;border-radius:10px;cursor:pointer;white-space:nowrap;
  display:flex;align-items:center;justify-content:center;gap:6px;transition:.15s;
}
.tab-btn .ic{font-size:15px;}
.tab-btn.active{background:var(--primary);color:#fff;}
.tab-btn:not(.active):hover{background:var(--surface);color:var(--text);}

.view{display:none;max-width:640px;margin:0 auto;}
.view.active{display:block;}

.card{
  background:var(--surface);border:1px solid var(--border);border-radius:20px;
  padding:20px;box-shadow:var(--shadow);
}

/* Phones: pull the tab bar out of the navbar into a fixed bottom bar, app-style */
@media (max-width:600px){
  .wrap{padding-bottom:96px;}
  .tabbar{
    position:fixed;left:12px;right:12px;bottom:14px;z-index:70;
    background:var(--surface);padding:6px;border-radius:16px;
    box-shadow:0 12px 32px rgba(15,23,42,.22);
  }
  .tab-btn{flex:1;padding:12px 10px;font-size:14px;}
}

/* scramble */
.scramble-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px;flex-wrap:wrap;}
.scramble-title{display:flex;align-items:center;gap:10px;}
.scramble-title h3{margin:0;font-size:15px;font-weight:800;letter-spacing:-.2px;}
.move-badge{
  display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:50px;
  background:var(--primary-light);color:var(--primary);font-size:11.5px;font-weight:700;
}
.move-badge::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--primary);}
.icon-btn{
  background:var(--surface-soft);border:1px solid var(--border);color:var(--text-soft);
  border-radius:10px;width:36px;height:36px;cursor:pointer;font-size:16px;
  display:flex;align-items:center;justify-content:center;transition:.2s;
}
.icon-btn:hover{color:var(--primary);border-color:var(--primary);}
.scramble-box{
  background:var(--surface-soft);border:1px dashed var(--border);border-radius:16px;
  padding:16px;display:flex;flex-wrap:wrap;gap:8px;min-height:56px;align-items:center;
}
.chip{
  font-family:'JetBrains Mono',monospace;font-weight:700;font-size:15px;
  background:var(--surface);border:1.5px solid var(--border);border-left:5px solid #999;
  border-radius:9px;padding:6px 11px;color:var(--text);box-shadow:0 2px 6px rgba(15,23,42,.05);
}

/* timer zone */
.timer-zone{
  margin-top:18px;border-radius:20px;border:2px solid var(--border);
  background:var(--surface);min-height:270px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  cursor:pointer;user-select:none;-webkit-touch-callout:none;-webkit-user-select:none;touch-action:none;
  transition:border-color .15s, box-shadow .15s;padding:20px;text-align:center;
}
.timer-zone.state-ready{border-color:#22c55e;box-shadow:0 0 0 3px rgba(34,197,94,.15);}
.timer-zone.state-hold{border-color:#ef4444;box-shadow:0 0 0 3px rgba(239,68,68,.13);}
.timer-zone.state-running{border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.13);}
.timer-zone.state-inspect{border-color:#f59e0b;box-shadow:0 0 0 3px rgba(245,158,11,.13);}

.big-time{
  font-family:'JetBrains Mono',monospace;font-weight:800;
  font-size:clamp(52px,9vw,88px);letter-spacing:-0.02em;line-height:1;color:var(--text);
}
.state-ready .big-time{color:#16a34a;}
.state-hold .big-time{color:#dc2626;}
.state-running .big-time{color:#2563eb;}
.inspect-num{font-family:'JetBrains Mono',monospace;font-size:22px;font-weight:800;color:#f59e0b;}
.hint{color:var(--text-soft);font-size:13px;font-weight:500;}
.pending-pen{font-size:12px;color:#ea580c;font-weight:700;}

/* stats */
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
@media (min-width:520px){
  .stats-grid{grid-template-columns:repeat(4,1fr);}
}
.stat-tile{background:var(--surface-soft);border:1px solid var(--border);border-radius:14px;padding:11px 13px;}
.stat-tile .label{font-size:11px;color:var(--text-soft);text-transform:uppercase;letter-spacing:.06em;font-weight:700;}
.stat-tile .value{font-family:'JetBrains Mono',monospace;font-weight:800;font-size:19px;margin-top:3px;}
.stat-tile.pb{background:var(--primary-light);border-color:#bfdbfe;}
.stat-tile.pb .value{color:var(--primary);}
.stat-tile.clickable{cursor:pointer;transition:.15s;}
.stat-tile.clickable:hover{border-color:var(--primary);transform:translateY(-1px);}
.share-ic{font-size:10px;opacity:.55;margin-left:3px;}

.side-title{
  font-size:12.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--text-soft);font-weight:800;
  margin:20px 0 10px;display:flex;justify-content:space-between;align-items:center;
}
.side-title button{background:none;border:none;color:var(--text-soft);font-size:12px;cursor:pointer;text-decoration:underline;padding:0;font-family:'Inter',sans-serif;}
.side-title button:hover{color:#dc2626;}

.history{display:flex;flex-direction:column;gap:6px;max-height:calc(100vh - 340px);min-height:160px;overflow-y:auto;}
.solve-row{
  display:flex;align-items:center;gap:8px;background:var(--surface-soft);
  border:1px solid var(--border);border-radius:12px;padding:8px 10px;font-size:13px;
}
.solve-row .idx{color:var(--text-soft);width:24px;flex:none;font-size:12px;font-weight:600;}
.solve-row .t{font-family:'JetBrains Mono',monospace;font-weight:800;flex:1;cursor:help;}
.solve-row .t.dnf{color:#dc2626;}
.solve-row .t.plus2{color:#ea580c;}
.solve-row .btns{display:flex;gap:4px;flex:none;}
.mini-btn{
  border:1px solid var(--border);background:var(--surface);color:var(--text-soft);
  border-radius:7px;font-size:11px;padding:4px 7px;cursor:pointer;font-weight:700;font-family:'Inter',sans-serif;
}
.mini-btn.on-plus2{background:#f97316;border-color:#f97316;color:#fff;}
.mini-btn.on-dnf{background:#ef4444;border-color:#ef4444;color:#fff;}
.mini-btn:hover{color:var(--primary);}
.mini-btn.del:hover{background:#ef4444;border-color:#ef4444;color:#fff;}
.empty-hist{color:var(--text-soft);font-size:13px;padding:16px 4px;text-align:center;}

/* generic confirm/settings modal */
.modal{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:22px;width:100%;max-width:360px;box-shadow:0 25px 60px rgba(15,23,42,.25);}
.modal h3{margin:0 0 14px;font-size:16px;font-weight:800;}
.row-set{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--border);}
.row-set:last-of-type{border-bottom:none;}
.switch{position:relative;width:42px;height:24px;background:#cbd5e1;border-radius:999px;cursor:pointer;flex:none;transition:.15s;}
.switch.on{background:#22c55e;}
.switch::after{content:'';position:absolute;top:2px;left:2px;width:20px;height:20px;background:#fff;border-radius:50%;transition:.15s;box-shadow:0 1px 3px rgba(0,0,0,.3);}
.switch.on::after{left:20px;}
.modal-btns{display:flex;gap:10px;margin-top:18px;}
.btn{flex:1;padding:11px;border-radius:11px;border:1px solid var(--border);background:var(--surface-soft);color:var(--text);font-family:'Inter',sans-serif;font-weight:700;cursor:pointer;font-size:13px;}
.btn.danger{background:#ef4444;border-color:#ef4444;color:#fff;}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff;}
.btn:hover{filter:brightness(1.06);}

.toast{
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
  background:var(--text);color:var(--background);padding:10px 18px;border-radius:999px;font-size:13px;
  font-weight:600;z-index:90;opacity:0;pointer-events:none;transition:opacity .2s, transform .2s;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}
</style>
</head>
<body>
<div class="wrap">

  <header class="navbar">
    <div class="nav-logo">
      <div class="nav-logo-mark"><div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div></div>
      <div class="nav-logo-text">Küp Zamanlayıcı<span>Rubik Academy</span></div>
    </div>
    <nav class="tabbar" id="tabbar">
      <button class="tab-btn active" id="tabTimerBtn" data-view="timer"><span class="ic">⏱️</span> Zamanlayıcı</button>
      <button class="tab-btn" id="tabStatsBtn" data-view="stats"><span class="ic">📊</span> İstatistikler</button>
    </nav>
    <div class="nav-right">
      <button class="cube-select-btn" id="cubeSelectBtn">
        <span class="wheel" id="selectBtnIcon" style="width:22px;height:22px;"></span>
        <span class="name" id="selectBtnName">3x3x3</span>
        <span class="chev">▾</span>
      </button>
      <button class="gear-btn dark-mode-btn" id="gearBtn" title="Ayarlar">⚙</button>
      <button class="dark-mode-btn" id="darkModeBtn" title="Tema">🌙</button>
    </div>
  </header>

  <section class="view active" id="viewTimer">
    <div class="card">
      <div class="scramble-head">
        <div class="scramble-title">
          <h3>Karışım</h3>
          <span class="move-badge" id="moveBadge">0 hamle</span>
        </div>
        <button class="icon-btn" id="newScrambleBtn" title="Yeni karışım">⟳</button>
      </div>
      <div class="scramble-box" id="scrambleChips"></div>
    </div>

    <div class="timer-zone" id="timerZone">
      <div class="big-time" id="bigTime">0.00</div>
      <div class="inspect-num" id="inspectNum" style="display:none;"></div>
      <div class="pending-pen" id="pendingPen" style="display:none;"></div>
      <div class="hint" id="hintText">Boşluk tuşuna basılı tut, bıraktığında zamanlayıcı başlar</div>
    </div>
  </section>

  <section class="view" id="viewStats">
    <div class="card">
      <div class="side-title">İstatistikler</div>
      <div class="stats-grid" id="statsGrid"></div>

      <div class="side-title">
        Geçmiş <span id="histCount"></span>
        <button id="clearAllBtn">tümünü sil</button>
      </div>
      <div class="history" id="historyList"></div>
    </div>
  </section>

</div>

<!-- cube picker -->
<div class="overlay" id="pickerOverlay">
  <div class="picker-modal">
    <h3>Küp türü seç</h3>
    <div class="picker-grid" id="pickerGrid"></div>
    <button class="picker-close" id="pickerCloseBtn">Kapat</button>
  </div>
</div>

<!-- settings -->
<div class="overlay" id="settingsOverlay">
  <div class="modal">
    <h3>Ayarlar</h3>
    <div class="row-set">
      <span>15 sn inceleme süresi</span>
      <div class="switch" id="inspectSwitch"></div>
    </div>
    <div class="modal-btns">
      <button class="btn primary" id="closeSettingsBtn">Kapat</button>
    </div>
  </div>
</div>

<!-- confirm -->
<div class="overlay" id="confirmOverlay">
  <div class="modal">
    <h3 id="confirmText">Emin misin?</h3>
    <div class="modal-btns">
      <button class="btn" id="confirmCancelBtn">Vazgeç</button>
      <button class="btn danger" id="confirmOkBtn">Evet, sil</button>
    </div>
  </div>
</div>

<!-- solve detail -->
<div class="overlay" id="detailOverlay">
  <div class="modal">
    <h3>Çözüm Detayı</h3>
    <div class="row-set" style="border-bottom:none;padding-bottom:4px;">
      <span>Süre</span>
      <span class="value" id="detailTime" style="font-family:'JetBrains Mono',monospace;font-weight:800;font-size:20px;"></span>
    </div>
    <div class="row-set">
      <span>Tarih</span>
      <span id="detailDate" style="font-weight:600;font-size:13px;color:var(--text-soft);"></span>
    </div>
    <div style="margin-top:12px;">
      <div style="font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-soft);font-weight:700;margin-bottom:8px;">Karışım</div>
      <div class="scramble-box" id="detailScramble" style="min-height:auto;"></div>
    </div>
    <div class="modal-btns">
      <button class="btn primary" id="closeDetailBtn">Kapat</button>
    </div>
  </div>
</div>

<!-- share -->
<div class="overlay" id="shareOverlay">
  <div class="modal" style="max-width:480px;">
    <h3 id="shareModalTitle">Paylaş</h3>
    <textarea id="shareText" readonly style="width:100%;min-height:220px;font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.5;padding:10px;border-radius:10px;border:1px solid var(--border);background:var(--surface-soft);color:var(--text);resize:vertical;"></textarea>
    <div class="modal-btns">
      <button class="btn" id="shareCloseBtn">Kapat</button>
      <button class="btn primary" id="shareCopyBtn">Kopyala</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>


<script>
/* ================= CUBE TYPES ================= */
const CUBE_TYPES = [
  {id:'222', name:'2x2x2', sub:'Karışım: U R F', cat:'222'},
  {id:'333', name:'3x3x3', sub:'Klasik küp', cat:'nxn', n:3},
  {id:'333oh', name:'3x3 OH', sub:'Tek elle çözüm', cat:'nxn', n:3},
  {id:'444', name:'4x4x4', sub:'Geniş hamleler', cat:'nxn', n:4},
  {id:'555', name:'5x5x5', sub:'Geniş hamleler', cat:'nxn', n:5},
  {id:'666', name:'6x6x6', sub:'Büyük küp', cat:'nxn', n:6},
  {id:'777', name:'7x7x7', sub:'Büyük küp', cat:'nxn', n:7},
  {id:'pyra', name:'Pyraminx', sub:'Üçgen piramit', cat:'pyra'},
  {id:'skewb', name:'Skewb', sub:'Köşe çevirmeli', cat:'skewb'},
  {id:'mega', name:'Megaminx', sub:'12 yüzeyli', cat:'mega'},
  {id:'sq1', name:'Square-1', sub:'Şekil değiştiren', cat:'sq1'},
  {id:'fto', name:'FTO', sub:'Face-Turning Octahedron', cat:'fto'},
];
const FACE_COLOR = {U:'var(--c-u)',D:'var(--c-d)',L:'var(--c-l)',R:'var(--c-r)',F:'var(--c-f)',B:'var(--c-b)',BR:'var(--c-br)',BL:'var(--c-bl)'};

function randInt(n){return Math.floor(Math.random()*n);}

/* 2x2: WCA notation only uses U, R, F (no L/D/B — solving fixes one corner) */
function gen222(){
  const faces=['U','R','F'];
  const mods=['',"'",'2'];
  const length = 7 + randInt(2); // 7-8 hamle
  const moves=[]; let last=-1;
  for(let i=0;i<length;i++){
    let f; do{f=randInt(3);}while(f===last);
    last=f;
    moves.push(faces[f]+mods[randInt(3)]);
  }
  return moves.join(' ');
}
function genNxN(n){
  const faces=['U','D','L','R','F','B'];
  const axis={U:0,D:0,L:1,R:1,F:2,B:2};
  const mods=['',"'",'2'];
  let length;
  if(n===3) length=20; else if(n===4) length=42;
  else if(n===5) length=60; else if(n===6) length=72; else length=84;
  const maxDepth = Math.floor(n/2);
  const moves=[]; let lastAxis=-1;
  for(let i=0;i<length;i++){
    let face, axIdx, tries=0;
    do{ face=faces[randInt(6)]; axIdx=axis[face]; tries++; } while(axIdx===lastAxis && tries<25);
    lastAxis=axIdx;
    let notation=face;
    if(n>=4 && maxDepth>=2 && Math.random()<0.45){
      const depth = 2+randInt(maxDepth-1);
      if(Math.random()<0.5 && depth<n){ notation = depth+face; }
      else { notation = (depth>2?depth:'')+face+'w'; }
    }
    notation += mods[randInt(3)];
    moves.push(notation);
  }
  return moves.join(' ');
}
function genPyraminx(){
  const faces=['U','L','R','B']; const mods=['',"'"];
  const moves=[]; let last=-1;
  for(let i=0;i<8;i++){ let f; do{f=randInt(4);}while(f===last); last=f; moves.push(faces[f]+mods[randInt(2)]); }
  ['u','l','r','b'].forEach(t=>{ if(Math.random()<0.75) moves.push(t+mods[randInt(2)]); });
  return moves.join(' ');
}
function genSkewb(){
  const faces=['U','L','R','B']; const mods=['',"'"];
  const moves=[]; let last=-1;
  for(let i=0;i<10;i++){ let f; do{f=randInt(4);}while(f===last); last=f; moves.push(faces[f]+mods[randInt(2)]); }
  return moves.join(' ');
}
function genMegaminx(){
  const moves=[];
  for(let round=0;round<7;round++){
    for(let i=0;i<5;i++){
      moves.push('R'+(Math.random()<0.5?'++':'--'));
      moves.push('D'+(Math.random()<0.5?'++':'--'));
    }
    moves.push(Math.random()<0.5?'U':"U'");
  }
  return moves.join(' ');
}
function genSquare1(){
  const parts=[];
  for(let i=0;i<12;i++){
    const x=randInt(12)-6, y=randInt(12)-6;
    parts.push(`(${x},${y})`);
    if(i<11) parts.push('/');
  }
  return parts.join(' ');
}
/* FTO: 8 faces U D F B R L BR BL. Clockwise = letter, CCW = letter'. No double turns (3-fold symmetry) */
function genFTO(){
  const faces=['U','D','F','B','R','L','BR','BL'];
  const axis={U:0,D:0,F:1,B:1,R:2,L:2,BR:3,BL:3};
  const mods=['',"'"];
  const length=30;
  const moves=[]; let lastAxis=-1;
  for(let i=0;i<length;i++){
    let face, axIdx, tries=0;
    do{ face=faces[randInt(8)]; axIdx=axis[face]; tries++; } while(axIdx===lastAxis && tries<25);
    lastAxis=axIdx;
    moves.push(face+mods[randInt(2)]);
  }
  return moves.join(' ');
}
function generateScramble(typeId){
  const t = CUBE_TYPES.find(c=>c.id===typeId);
  if(t.cat==='222') return gen222();
  if(t.cat==='nxn') return genNxN(t.n);
  if(t.cat==='pyra') return genPyraminx();
  if(t.cat==='skewb') return genSkewb();
  if(t.cat==='mega') return genMegaminx();
  if(t.cat==='sq1') return genSquare1();
  if(t.cat==='fto') return genFTO();
  return '';
}

/* ================= STORAGE ================= */
/* Uses window.storage when running inside Claude.ai (persists server-side per user).
   Falls back to real localStorage automatically when window.storage isn't available
   (e.g. this file opened directly in a browser or hosted on your own site) so times
   still survive a refresh in either environment. */
function hasCloudStorage(){
  return typeof window !== 'undefined' && !!window.storage && typeof window.storage.get === 'function';
}
async function storageGet(key){
  if(hasCloudStorage()){
    try{ const r = await window.storage.get(key, false); return r ? r.value : null; }
    catch(e){ return null; }
  }
  try{ return localStorage.getItem(key); } catch(e){ return null; }
}
async function storageSet(key, value){
  if(hasCloudStorage()){
    try{ await window.storage.set(key, value, false); return; } catch(e){}
  }
  try{ localStorage.setItem(key, value); } catch(e){}
}
async function loadSolves(cubeId){
  const raw = await storageGet('cube:'+cubeId+':times');
  try{ return raw ? JSON.parse(raw) : []; } catch(e){ return []; }
}
async function saveSolves(cubeId, solves){
  await storageSet('cube:'+cubeId+':times', JSON.stringify(solves));
}
async function loadSettings(){
  const raw = await storageGet('settings-v1');
  try{ return raw ? JSON.parse(raw) : {inspection:false}; } catch(e){ return {inspection:false}; }
}
async function saveSettings(s){ await storageSet('settings-v1', JSON.stringify(s)); }
async function loadLastCube(){
  const raw = await storageGet('last-cube-id');
  return raw || '333';
}
async function saveLastCube(id){ await storageSet('last-cube-id', id); }
async function loadTheme(){
  const raw = await storageGet('ui-theme');
  return raw || 'light';
}
async function saveTheme(v){ await storageSet('ui-theme', v); }

/* ================= HELPERS ================= */
function formatTime(ms){
  if(ms === Infinity || ms === null) return 'DNF';
  const cs = Math.round(ms/10);
  const m = Math.floor(cs/6000);
  const s = Math.floor((cs%6000)/100);
  const c = cs%100;
  if(m>0) return m+':'+String(s).padStart(2,'0')+'.'+String(c).padStart(2,'0');
  return s+'.'+String(c).padStart(2,'0');
}
function getFinal(solve){
  if(solve.penalty==='dnf') return Infinity;
  if(solve.penalty==='+2') return solve.raw+2000;
  return solve.raw;
}
function trimmedAverage(n, list){
  if(list.length < n) return null;
  const window = list.slice(0,n).map(getFinal);
  const trim = n<=12 ? 1 : Math.max(1, Math.round(n*0.05));
  const dnfCount = window.filter(t=>t===Infinity).length;
  if(dnfCount > trim) return Infinity;
  const sorted = [...window].sort((a,b)=>a-b);
  const trimmed = sorted.slice(trim, sorted.length-trim);
  const sum = trimmed.reduce((a,b)=>a+b,0);
  return sum/trimmed.length;
}
function computeStats(){
  const finals = solves.map(getFinal);
  const valid = finals.filter(f=>f!==Infinity);
  const pb = valid.length ? Math.min(...valid) : null;
  const mean = valid.length ? valid.reduce((a,b)=>a+b,0)/valid.length : null;
  return {
    pb, mean,
    ao5: trimmedAverage(5, solves),
    ao12: trimmedAverage(12, solves),
    ao50: trimmedAverage(50, solves),
    ao100: trimmedAverage(100, solves),
    count: solves.length
  };
}
function fmtStat(v){
  if(v===null || v===undefined) return '-';
  if(v===Infinity) return 'DNF';
  return formatTime(v);
}
function showToast(msg){
  const t = document.getElementById('toast');

  t.classList.add('show');
  clearTimeout(showToast._id);
  showToast._id = setTimeout(()=>t.classList.remove('show'), 1800);
}
function isTouchDevice(){ return 'ontouchstart' in window || navigator.maxTouchPoints > 0; }

  const s = computeStats();

  const tiles = [
    ['PB', fmtStat(s.pb), {pb:true}],
    ['Ao5', fmtStat(s.ao5), {avgN:5, has:s.ao5!==null}],
    ['Ao12', fmtStat(s.ao12), {avgN:12, has:s.ao12!==null}],
    ['Ao50', fmtStat(s.ao50), {avgN:50, has:s.ao50!==null}],
    ['Ao100', fmtStat(s.ao100), {avgN:100, has:s.ao100!==null}],

  ];

/* ================= SHARE ================= */
function buildShareText(n){
  if(solves.length < n) return null;
  const recent = solves.slice(0, n);           // en yeni ilk
  const chronological = [...recent].reverse(); // eskiden yeniye
  const finals = chronological.map(getFinal);
  const validFinals = finals.filter(f=>f!==Infinity);
  const minVal = validFinals.length ? Math.min(...validFinals) : null;
  const maxVal = validFinals.length ? Math.max(...validFinals) : null;
  const hasDNF = finals.some(f=>f===Infinity);
  let minMarked = false, maxMarked = false;
  const lines = chronological.map((sv, i)=>{
    const f = finals[i];
    let text = f===Infinity ? 'DNF' : formatTime(f);
    const isBest = !minMarked && minVal!==null && f===minVal;
    let isWorst = false;
    if(!isBest){
      isWorst = hasDNF ? (!maxMarked && f===Infinity) : (!maxMarked && maxVal!==null && f===maxVal);
    }
    if(isBest){ text = '('+text+')'; minMarked = true; }
    else if(isWorst){ text = '('+text+')'; maxMarked = true; }
    return `${i+1}. ${text}   ${sv.scramble}`;
  });
  const avg = trimmedAverage(n, solves);
  const avgText = avg===null ? '-' : (avg===Infinity ? 'DNF' : formatTime(avg));
  const dateStr = new Date().toISOString().slice(0,10);
  return `RA Timer tarafından ${dateStr} günü oluşturuldu\n${n} çözümün ortalaması: ${avgText}\nSüreler:\n${lines.join('\n')}`;
}

function renderHistory(){
  const list = document.getElementById('historyList');
  if(!solves.length){
    list.innerHTML = '<div class="empty-hist">Henüz çözüm yok. Zamanlayıcıyı başlat!</div>';
    return;
  }
  list.innerHTML = solves.map((sv, i)=>{
    const idx = solves.length - i;
    const cls = sv.penalty==='dnf' ? 'dnf' : sv.penalty==='+2' ? 'plus2' : '';
    const timeText = sv.penalty==='dnf' ? 'DNF' : formatTime(getFinal(sv));
    return `<div class="solve-row">
      <div class="idx">${idx}.</div>
      <div class="t ${cls}" data-id="${sv.id}" title="Detay için tıkla">${timeText}</div>
      <div class="btns">
        <button class="mini-btn ${sv.penalty==='+2'?'on-plus2':''}" data-act="plus2" data-id="${sv.id}">+2</button>
        <button class="mini-btn ${sv.penalty==='dnf'?'on-dnf':''}" data-act="dnf" data-id="${sv.id}">DNF</button>
        <button class="mini-btn del" data-act="del" data-id="${sv.id}">✕</button>
      </div>
    </div>`;
  }).join('');

  list.querySelectorAll('.t').forEach(el=>{
    el.addEventListener('click', ()=>{
      const sv = solves.find(x=>x.id===el.dataset.id);
      if(sv) showSolveDetail(sv);
    });
  });
  list.querySelectorAll('.mini-btn').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      e.stopPropagation();
      const id = btn.dataset.id;
      const act = btn.dataset.act;
      const sv = solves.find(x=>x.id===id);
      if(!sv) return;
      if(act==='del'){ solves = solves.filter(x=>x.id!==id); }
      else if(act==='plus2'){ sv.penalty = sv.penalty==='+2' ? 'ok' : '+2'; }
      else if(act==='dnf'){ sv.penalty = sv.penalty==='dnf' ? 'ok' : 'dnf'; }
      saveSolves(currentCube, solves);
      renderStats();
      renderHistory();
    });
  });
}

/* ================= TIMER STATE MACHINE ================= */
const zone = document.getElementById('timerZone');
const bigTime = document.getElementById('bigTime');
const inspectNum = document.getElementById('inspectNum');
const hintText = document.getElementById('hintText');
const pendingPenEl = document.getElementById('pendingPen');

function setZoneClass(cls){ zone.className = 'timer-zone' + (cls ? ' '+cls : ''); }
function resetToIdle(){
  clearTimeout(holdTimeoutId);
  clearInterval(inspectIntervalId);
  clearTimeout(inspectTimeoutId);
  clearInterval(runIntervalId);
  timerState = 'idle';
  pendingPenalty = null;
  bigTime.textContent = '0.00';
  inspectNum.style.display = 'none';
  pendingPenEl.style.display = 'none';
  hintText.textContent = isTouchDevice()
    ? 'Ekrana dokunup basılı tut, bıraktığında zamanlayıcı başlar'
    : 'Boşluk tuşuna basılı tut, bıraktığında zamanlayıcı başlar';
  setZoneClass('');
}
function startInspection(){
  timerState = 'inspect';
  inspectStart = Date.now();
  inspectNum.style.display = 'block';
  hintText.textContent = 'İnceleme... basılı tutup bırak';
  setZoneClass('state-inspect');
  inspectIntervalId = setInterval(()=>{
    const elapsed = (Date.now()-inspectStart)/1000;
    const remain = Math.max(0, 15-elapsed);
    inspectNum.textContent = remain.toFixed(1)+' sn';
    if(elapsed>15) inspectNum.style.color = elapsed>17 ? '#dc2626' : '#ea580c';
  }, 100);
  inspectTimeoutId = setTimeout(()=>{
    if(timerState==='inspect'){ showToast('İnceleme süresi doldu (17 sn)'); resetToIdle(); }
  }, 17000);
}
function armHold(){
  clearTimeout(holdTimeoutId);
  const priorState = timerState;
  if(priorState==='idle'){ timerState='hold'; setZoneClass('state-hold'); hintText.textContent='Hazırlanıyor...'; bigTime.textContent='0.00'; }
  holdTimeoutId = setTimeout(()=>{
    if(timerState==='hold'){ timerState='ready'; setZoneClass('state-ready'); hintText.textContent='Bırak ve başlat!'; }
    else if(timerState==='inspect'){ timerState='readyInspect'; setZoneClass('state-ready'); hintText.textContent='Bırak ve başlat!'; }
  }, HOLD_MS);
}
function startStopwatch(){
  timerState = 'running';
  setZoneClass('state-running');
  hintText.textContent = 'Durdurmak için dokun / boşluk';
  runStart = Date.now();
  runIntervalId = setInterval(()=>{ bigTime.textContent = formatTime(Date.now()-runStart); }, 30);
}
async function stopAndRecord(){
  // Guard against re-entrancy: bail immediately if we're not actually running,
  // or if this has already been called for the current run.
  if(timerState !== 'running') return;
  clearInterval(runIntervalId);
  const raw = Date.now()-runStart;
  const finalMs = pendingPenalty==='+2' ? raw+2000 : raw;
  const displayText = formatTime(finalMs);
  const solve = {
    id: Date.now()+'-'+Math.random().toString(36).slice(2,8),
    raw, penalty: pendingPenalty || 'ok', scramble, date: new Date().toISOString()
  };
  solves.unshift(solve);
  pendingPenalty = null;
  // Reset the state machine SYNCHRONOUSLY, right away (before the storage
  // write below, which is async). This closes the window where a very fast
  // second press/click right after stopping could see timerState still
  // 'running' and call stopAndRecord() a second time, recording a duplicate
  // solve for the same attempt.
  resetToIdle();
  bigTime.textContent = displayText;
  newScramble();
  renderStats();
  renderHistory();
  // Persist to storage in the background — state is already safely reset.
  await saveSolves(currentCube, solves);
}
function engage(){
  if(timerState==='running'){ stopAndRecord(); return; }
  if(timerState==='idle'){
    if(settings.inspection){ startInspection(); }
    armHold();
  } else if(timerState==='inspect' || timerState==='hold'){
    armHold();
  }
}
function release(){
  clearTimeout(holdTimeoutId);
  if(timerState==='ready'){
    startStopwatch();
  } else if(timerState==='readyInspect'){
    const inspElapsed = Date.now()-inspectStart;
    clearInterval(inspectIntervalId);
    clearTimeout(inspectTimeoutId);
    if(inspElapsed > 17000){ showToast('17 saniyeyi geçtin — DNF'); resetToIdle(); return; }
    pendingPenalty = inspElapsed>15000 ? '+2' : null;
    if(pendingPenalty){ pendingPenEl.style.display='block'; pendingPenEl.textContent = '+2 ceza uygulanacak'; }
    startStopwatch();
  } else if(timerState==='hold'){
    timerState='idle'; setZoneClass('');
    hintText.textContent = isTouchDevice() ? 'Ekrana dokunup basılı tut' : 'Boşluk tuşuna basılı tut';
  } else if(timerState==='inspect'){
    hintText.textContent = 'İnceleme... basılı tutup bırak';
  }
}

    const target = btn.dataset.view === 'timer' ? 'viewTimer' : 'viewStats';
    document.getElementById(target).classList.add('active');
    // If we're switching away from the timer mid-run/hold, don't leave a
    // dangling timer state behind — reset it so it's not silently running.
    if(target !== 'viewTimer' && timerState !== 'idle'){ resetToIdle(); }
  });
});

/* ================= CUBE PICKER MODAL ================= */
const pickerOverlay = document.getElementById('pickerOverlay');
document.getElementById('cubeSelectBtn').addEventListener('click', ()=>{ renderPicker(); pickerOverlay.classList.add('open'); });
document.getElementById('pickerCloseBtn').addEventListener('click', ()=>pickerOverlay.classList.remove('open'));
pickerOverlay.addEventListener('click', (e)=>{ if(e.target===pickerOverlay) pickerOverlay.classList.remove('open'); });

/* ================= SETTINGS MODAL ================= */
const settingsOverlay = document.getElementById('settingsOverlay');
document.getElementById('gearBtn').addEventListener('click', ()=>settingsOverlay.classList.add('open'));
document.getElementById('closeSettingsBtn').addEventListener('click', ()=>settingsOverlay.classList.remove('open'));
settingsOverlay.addEventListener('click', (e)=>{ if(e.target===settingsOverlay) settingsOverlay.classList.remove('open'); });
const inspectSwitch = document.getElementById('inspectSwitch');
inspectSwitch.addEventListener('click', ()=>{
  settings.inspection = !settings.inspection;
  inspectSwitch.classList.toggle('on', settings.inspection);
  saveSettings(settings);
});

/* ================= CONFIRM MODAL ================= */
const confirmOverlay = document.getElementById('confirmOverlay');
document.getElementById('clearAllBtn').addEventListener('click', ()=>{
  if(!solves.length){ showToast('Silinecek çözüm yok'); return; }
  document.getElementById('confirmText').textContent =
    CUBE_TYPES.find(c=>c.id===currentCube).name + ' için tüm çözümleri silmek istediğine emin misin?';
  confirmOverlay.classList.add('open');
});
document.getElementById('confirmCancelBtn').addEventListener('click', ()=>confirmOverlay.classList.remove('open'));
document.getElementById('confirmOkBtn').addEventListener('click', async ()=>{
  solves = [];
  await saveSolves(currentCube, solves);
  renderStats();
  renderHistory();
  confirmOverlay.classList.remove('open');
  showToast('Tüm çözümler silindi');
});

/* new scramble */
document.getElementById('newScrambleBtn').addEventListener('click', newScramble);

/* dark mode */
document.getElementById('darkModeBtn').addEventListener('click', async ()=>{
  const isDark = document.documentElement.classList.toggle('dark-mode');
  document.getElementById('darkModeBtn').textContent = isDark ? '☀️' : '🌙';
  await saveTheme(isDark ? 'dark' : 'light');
});

/* ================= INIT ================= */
async function init(){
  const theme = await loadTheme();
  if(theme==='dark'){ document.documentElement.classList.add('dark-mode'); document.getElementById('darkModeBtn').textContent='☀️'; }
  settings = await loadSettings();
  inspectSwitch.classList.toggle('on', !!settings.inspection);
  currentCube = await loadLastCube();
  if(!CUBE_TYPES.find(c=>c.id===currentCube)) currentCube = '333';
  solves = await loadSolves(currentCube);
  renderSelectBtn();
  renderPicker();
  newScramble();
  renderStats();
  renderHistory();
  resetToIdle();
}
init();
</script>
</body>
</html>
