    if (savedTheme === "dark") {
      document.documentElement.classList.add("dark-mode");
    }
  })();
</script>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
/* =========================================
   RENKLER VE DEĞİŞKENLER
========================================= */
:root {
    --background: #f8fafc;
    --surface: #ffffff;
    --surface-soft: #f1f5f9;
    --primary: #2563eb;
    --primary-dark: #1d4ed8;
    --primary-light: #eff6ff;
    --text: #172033;
    --text-soft: #64748b;
    --border: #e2e8f0;
    --card-border: #e0eaf4;
    --shadow: 0 15px 40px rgba(15, 23, 42, 0.07);
    --badge-bg: #edf7ff;
    --badge-border: #cfe8ff;
    --badge-text: #1682d4;
    --h1-color: #152238;
}

/* Karanlık Mod Değişkenleri */
html.dark-mode,
body.dark-mode {
    --background: #0f172a;
    --surface: #1e293b;
    --surface-soft: #334155;
    --text: #f8fafc;
    --text-soft: #cbd5e1;
    --border: #334155;
    --card-border: #334155;
    --shadow: 0 15px 40px rgba(0, 0, 0, 0.30);
    --primary-light: #1e3a8a;
    --primary: #3b82f6;
    --badge-bg: #1e3a8a;
    --badge-border: #1d4ed8;
    --badge-text: #60a5fa;
    --h1-color: #f8fafc;
}

/* =========================================
   GENEL SIFIRLAMA
========================================= */
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: "Inter", sans-serif;
    background: var(--background);
    color: var(--text);
    overflow-x: hidden;
    transition: background-color 0.3s ease, color 0.3s ease;
}

a {
    text-decoration: none;
    color: inherit;
}

/* =========================================
   ÜST BAR (NAVBAR)
========================================= */
.navbar {
    position: sticky;
    top: 0;
    z-index: 1000;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 7%;
    background: rgba(248, 250, 252, 0.85);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    transition: background-color 0.3s, border-color 0.3s;
}

html.dark-mode .navbar,
body.dark-mode .navbar {
    background: rgba(15, 23, 42, 0.90);
}

.nav-logo {
    display: flex;
    align-items: center;
    gap: 12px;
}

.nav-logo-mark {
    width: 38px;
    height: 38px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    gap: 2px;
    padding: 4px;
    border-radius: 10px;
    background: #1e293b;
    box-shadow: 0 8px 18px rgba(15, 23, 42, .18);
}

.nav-logo-mark div {
    border-radius: 2px;
    background: #f8fafc;
}

.nav-logo-mark div:nth-child(2),
.nav-logo-mark div:nth-child(8) {
    background: #ef4444;
}

.nav-logo-mark div:nth-child(4),
.nav-logo-mark div:nth-child(6) {
    background: #22c55e;
}

.nav-logo-mark div:nth-child(5) {
    background: #3b82f6;
}

.nav-logo-mark div:nth-child(1),
.nav-logo-mark div:nth-child(9) {
    background: #facc15;
}

.nav-logo-text {
    font-size: 17px;
    font-weight: 800;
    letter-spacing: -0.5px;
    color: var(--text);
}

.nav-links {
    display: flex;
    align-items: center;
    gap: 8px;
}

.nav-links a {
    padding: 9px 16px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    color: var(--text-soft);
    transition: .25s;
}

.nav-links a:hover,
.nav-links a.active {
    background: var(--primary-light);
    color: var(--primary);
}

/* KARANLIK MOD BUTONU */
.dark-mode-btn {
    border: none;
    background: var(--surface-soft);
    color: var(--text);
    width: 42px;
    height: 42px;
    border-radius: 50%;
    font-size: 20px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: .3s;
}

.dark-mode-btn:hover {
    transform: scale(1.08);
}

@media(max-width: 500px) {
    .navbar {
        padding: 14px 5%;
    }
    .nav-logo-text {
        font-size: 15px;
    }
    .nav-links a {
        padding: 8px 12px;
        font-size: 13px;
    }
}

/* =========================================
   SAYFA DÜZENİ & ÇOK YAKINDA KARTI
========================================= */
.page {
    min-height: calc(100vh - 71px);
    padding: 40px 5% 60px;
    display: flex;
    flex-direction: column;
    align-items: center;
    background: var(--background);
    transition: background-color 0.3s;
}

/* NAV / GERİ DÖN */
.nav-bar {
    width: 100%;
    max-width: 850px;
    margin-bottom: 30px;
}

.back-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 11px 20px;
    border-radius: 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--primary);
    font-size: 13px;
    font-weight: 800;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.04);
    transition: all .25s ease;
}

.back-btn:hover {
    transform: translateX(-4px);
    border-color: #c0e0fc;
    background: var(--primary-light);
}

/* YAKINDA KART KUTUSU */
.coming-soon-card {
    width: 100%;
    max-width: 850px;
    background: var(--surface);
    border-radius: 32px;
    border: 1px solid var(--card-border);
    padding: 60px 40px;
    text-align: center;
    box-shadow: var(--shadow);
    position: relative;
    overflow: hidden;
    transition: background-color 0.3s, border-color 0.3s;
}

.coming-soon-card::before {
    content: "";
    position: absolute;
    width: 300px;
    height: 300px;
    border-radius: 50%;
    border: 45px solid rgba(255, 255, 255, 0.05);
    top: -150px;
    right: -100px;
    z-index: 1;
}

.content-wrap {
    position: relative;
    z-index: 2;
}

/* BADGE */
.badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 8px 16px;
    border-radius: 50px;
    background: var(--badge-bg);
    border: 1px solid var(--badge-border);
    color: var(--badge-text);
    font-size: 11px;
    font-weight: 900;
    letter-spacing: 1.5px;
    margin-bottom: 25px;
}

.badge i {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #20a4f3;
}

/* YAKINDA ICON */
.icon-wrap {
    width: 160px;
    height: 160px;
    margin: 0 auto 30px;
    filter: drop-shadow(0 15px 20px rgba(0, 0, 0, 0.15));
    animation: floating 4s ease-in-out infinite;
}

@keyframes floating {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
}

.coming-soon-card h1 {
    font-size: clamp(32px, 4vw, 48px);
    font-weight: 950;
    letter-spacing: -1.5px;
    color: var(--h1-color);
    margin-bottom: 15px;
}

.coming-soon-card h1 span {
    color: var(--primary);
}

.coming-soon-card p {
    font-size: 15px;
    line-height: 1.7;
    color: var(--text-soft);
    max-width: 540px;
    margin: 0 auto 35px;
}

.action-btn {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 14px 28px;
    border-radius: 14px;
    background: var(--primary);
    color: #ffffff;
    font-size: 13px;
    font-weight: 800;
    box-shadow: 0 10px 25px rgba(37, 99, 235, 0.3);
    transition: all .25s ease;
}

.action-btn:hover {
    background: var(--primary-dark);
    transform: translateY(-2px);
    box-shadow: 0 14px 30px rgba(37, 99, 235, 0.4);
}

@media(max-width: 600px) {
    .coming-soon-card { padding: 40px 20px; }
    .icon-wrap { width: 130px; height: 130px; }
}
</style>
</head>

<body>

<!-- =========================================
     ÜST BAR (NAVBAR)
========================================= -->
<header class="navbar">
    <a href="http://rubikacademy.fun" class="nav-logo">
        <div class="nav-logo-mark">
            <div></div>
            <div></div>
            <div></div>

            <div></div>
            <div></div>
            <div></div>

            <div></div>
            <div></div>
            <div></div>
        </div>

        <span class="nav-logo-text">
            Rubik Academy
        </span>
    </a>

    <nav class="nav-links">
        <a href="http://rubikacademy.fun">
            Ana Sayfa
        </a>
        <a href="http://rubikacademy.fun/icerikler" class="active">
            İçerikler
        </a>
    </nav>

    <button class="dark-mode-btn" id="darkModeBtn" onclick="toggleDarkMode()">
        🌙
    </button>
</header>

<!-- =========================================
     SAYFA İÇERİĞİ
========================================= -->
<div class="page">

    <!-- GERİ DÖN NAVİGASYONU -->
    <nav class="nav-bar">
        <a href="http://rubikacademy.fun/icerikler" class="back-btn">← Eğitimlere Geri Dön</a>
    </nav>

    <!-- İÇERİK KUTUSU -->
    <div class="coming-soon-card">
        <div class="content-wrap">
            
            <div class="badge">
                <i></i>
                İÇERİK HAZIRLANIYOR
            </div>

            <!-- 3D ANİMASYONLU SAAT/SAYFA İKONU -->
            <div class="icon-wrap">
                <svg viewBox="0 0 200 200" width="100%" height="100%">
                    <circle cx="100" cy="100" r="85" fill="#edf7ff" stroke="#cfe8ff" stroke-width="6"/>
                    <circle cx="100" cy="100" r="65" fill="#ffffff" stroke="#e0eaf4" stroke-width="4"/>
                    <!-- Akrep / Yelkovan -->
                    <path d="M100 100 L100 55" stroke="#1682d4" stroke-width="8" stroke-linecap="round"/>
                    <path d="M100 100 L135 100" stroke="#20a4f3" stroke-width="8" stroke-linecap="round"/>
                    <circle cx="100" cy="100" r="10" fill="#152238"/>
                    <!-- Dekoratif Noktalar -->
                    <circle cx="100" cy="42" r="4" fill="#708198"/>
                    <circle cx="158" cy="100" r="4" fill="#708198"/>

            <h1>Bu Eğitim <span>Çok Yakında!</span></h1>
            
            <p>

            </p>

</div>

<script>
/* =========================================================
   KARANLIK MOD TIKLAMA FONKSİYONU VE İKON AYARI
========================================================= */

function toggleDarkMode() {
    var isDark = document.documentElement.classList.toggle("dark-mode");
    document.body.classList.toggle("dark-mode", isDark);
    
    var btn = document.getElementById("darkModeBtn");

    if (isDark) {
        localStorage.setItem("theme", "dark");
        if(btn) btn.innerHTML = "☀️";
    } else {
        localStorage.setItem("theme", "light");
        if(btn) btn.innerHTML = "🌙";
    }
}

// DOM yüklendiğinde butonun ikonunu duruma göre güncelle
document.addEventListener("DOMContentLoaded", function() {
    var savedTheme = localStorage.getItem("theme");
    var btn = document.getElementById("darkModeBtn");
    
    if (savedTheme === "dark") {
        document.documentElement.classList.add("dark-mode");
        document.body.classList.add("dark-mode");
        if(btn) btn.innerHTML = "☀️";
    } else {
        if(btn) btn.innerHTML = "🌙";
    }
});
</script>

</body>
</html>
