																<style>

																	/* =========================================================
																	GENEL & RENK DEĞİŞKENLERİ
																	========================================================= */

																	:root {
																	--background: #f8fbff;
																	--surface: #ffffff;
																	--surface-soft: #f1f5f9;
																	--text: #172033;
																	--text-soft: #728197;
																	--border: #e2e8f0;
																	--card-border: #e0eaf4;
																	--shadow: 0 10px 30px rgba(39,84,125,.07);
																	--badge-bg: #edf7ff;
																	--badge-border: #cfe8ff;
																	--primary-light: #eff6ff;
																	--primary: #2563eb;
																	}

																	html.dark-mode, body.dark-mode {
																	--background: #0f172a;
																	--surface: #1e293b;
																	--surface-soft: #334155;
																	--text: #f8fafc;
																	--text-soft: #cbd5e1;
																	--border: #334155;
																	--card-border: #334155;
																	--shadow: 0 15px 40px rgba(0, 0, 0, 0.30);
																	--badge-bg: #1e3a8a;
																	--badge-border: #1d4ed8;
																	--primary-light: #1e3a8a;
																	--primary: #3b82f6;
																	}

																	.bg-glow {
																	position: fixed;
																	top: 0;
																	left: 0;
																	width: 100vw;
																	height: 100vh;
																	overflow: hidden;
																	z-index: -999;
																	pointer-events: none;
																	}

																	.bg-glow::before, .bg-glow::after {
																	content: "";
																	position: absolute;
																	width: 500px;
																	height: 500px;
																	border-radius: 50%;
																	filter: blur(120px);
																	opacity: 0.18;
																	animation: floatGlow 15s infinite alternate ease-in-out;
																	}

																	.bg-glow::before {
																	background: #2563eb;
																	top: -100px;
																	left: -100px;
																	}

																	.bg-glow::after {
																	background: #6366f1;
																	bottom: -100px;
																	right: -100px;
																	animation-delay: -7s;
																	}

																	@keyframes floatGlow {
																	0% { transform: translate(0px, 0px) scale(1); }
																	100% { transform: translate(150px, 200px) scale(1.25); }
																	}
																	html {
																    overflow-x: hidden;
																	}

																	* {
																    box-sizing: border-box;
																    margin: 0;
																    padding: 0;
																    }

																	html{
																	scroll-behavior:smooth;
																	}

																	body{
																	font-family:
																	Inter,
																	Arial,
																	Helvetica,
																	sans-serif;

																	background: var(--background);
																	color: var(--text);
																	transition: background-color 0.3s ease, color 0.3s ease;
																	overflow-x: hidden;
																	}

																	a{
																	text-decoration:none;
																	color:inherit;
																	}

																	/* =========================================================
																	ÜST BAR (NAVBAR)
																	========================================================= */

																	.navbar {
																	position: sticky;
																	top: 0;
																	z-index: 1000;
																	display: flex;
																	align-items: center;
																	justify-content: space-between;
																	padding: 16px 7%;
																	background: rgba(248, 250, 252, 0.85);
																	backdrop-filter: blur(12px);
																	-webkit-backdrop-filter: blur(12px);
																	border-bottom: 1px solid var(--border);
																	transition: background-color 0.3s, border-color 0.3s;
																	}

																	html.dark-mode .navbar,
																	body.dark-mode .navbar {
																	background: rgba(15, 23, 42, 0.90);
																	}

																	.nav-logo {
																	display: flex;
																	align-items: center;
																	gap: 12px;
																	}

																	.nav-logo-mark {
																	width: 38px;
																	height: 38px;
																	display: grid;
																	grid-template-columns: repeat(3,1fr);
																	grid-template-rows: repeat(3,1fr);
																	gap: 2px;
																	padding: 4px;
																	border-radius: 10px;
																	background: #1e293b;
																	box-shadow: 0 8px 18px rgba(15,23,42,.18);
																	}

																	.nav-logo-mark div {
																	border-radius: 2px;
																	background: #f8fafc;
																	}

																	.nav-logo-mark div:nth-child(2),
																	.nav-logo-mark div:nth-child(8) {
																	background: #ef4444;
																	}

																	.nav-logo-mark div:nth-child(4),
																	.nav-logo-mark div:nth-child(6) {
																	background: #22c55e;
																	}

																	.nav-logo-mark div:nth-child(5) {
																	background: #3b82f6;
																	}

																	.nav-logo-mark div:nth-child(1),
																	.nav-logo-mark div:nth-child(9) {
																	background: #facc15;
																	}

																	.nav-logo-text {
																	font-size: 17px;
																	font-weight: 800;
																	letter-spacing: -0.5px;
																	color: var(--text);
																	}

																	.nav-right {
																	display: flex;
																	align-items: center;
																	gap: 10px;
																	}

																	.nav-links {
																	display: flex;
																	align-items: center;
																	gap: 8px;
																	}

																	.nav-links a {
																	padding: 9px 16px;
																	border-radius: 10px;
																	font-size: 14px;
																	font-weight: 600;
																	color: var(--text-soft);
																	transition: .25s;
																	}

																	.nav-links a:hover {
																	background: var(--primary-light);
																	color: var(--primary);
																	}

																	.nav-links a.active {
																	background: var(--primary-light);
																	color: var(--primary);
																	}

																	.dark-mode-btn {
																	border: none;
																	background: var(--surface-soft);
																	color: var(--text);
																	width: 42px;
																	height: 42px;
																	border-radius: 50%;
																	font-size: 20px;
																	cursor: pointer;
																	display: flex;
																	align-items: center;
																	justify-content: center;
																	transition: .3s;
																	}

																	.dark-mode-btn:hover {
																	transform: scale(1.08);
																	}

																	.lang-switcher {
																	position: relative;
																	}

																	.lang-switch-btn {
																	border: none;
																	background: var(--surface-soft);
																	color: var(--text);
																	height: 42px;
																	padding: 0 16px;
																	border-radius: 21px;
																	font-size: 13px;
																	font-weight: 700;
																	letter-spacing: .3px;
																	cursor: pointer;
																	display: flex;
																	align-items: center;
																	gap: 7px;
																	transition: .3s;
																	}

																	.lang-switch-btn:hover {
																	transform: scale(1.06);
																	background: var(--primary-light);
																	color: var(--primary);
																	}

																	.lang-switch-btn .lang-globe {
																	font-size: 15px;
																	line-height: 1;
																	}

																	.lang-menu {
																	position: absolute;
																	top: calc(100% + 10px);
																	right: 0;
																	min-width: 168px;
																	background: var(--surface);
																	border: 1px solid var(--border);
																	border-radius: 16px;
																	box-shadow: var(--shadow);
																	padding: 7px;
																	display: flex;
																	flex-direction: column;
																	gap: 3px;
																	opacity: 0;
																	visibility: hidden;
																	transform: translateY(-8px);
																	transition: .2s ease;
																	z-index: 1100;
																	}

																	.lang-menu.open {
																	opacity: 1;
																	visibility: visible;
																	transform: translateY(0);
																	}

																	.lang-menu-item {
																	display: flex;
																	align-items: center;
																	gap: 10px;
																	border: none;
																	background: transparent;
																	color: var(--text);
																	text-align: left;
																	padding: 10px 14px;
																	border-radius: 11px;
																	font-size: 14px;
																	font-weight: 600;
																	cursor: pointer;
																	transition: .2s;
																	width: 100%;
																	}

																	.lang-menu-item:hover {
																	background: var(--primary-light);
																	color: var(--primary);
																	}

																	.lang-menu-item.active {
																	background: var(--primary-light);
																	color: var(--primary);
																	font-weight: 800;
																	}

																	.lang-menu-item .lang-check {
																	margin-left: auto;
																	font-size: 12px;
																	opacity: 0;
																	}

																	.lang-menu-item.active .lang-check {
																	opacity: 1;
																	}

																	@media(max-width:500px) {
																	.navbar {
																	padding: 14px 5%;
																	}

																	.nav-logo-text {
																	font-size: 15px;

																	/* =========================================================
																	3 TIKLANABİLİR ÖĞE — SADECE LOGO + KÜÇÜK BUTON
																	========================================================= */

																	.items{
																	width:100%;
																	max-width:680px;

																	grid-template-columns: repeat(3,1fr);
																	gap:26px;

																	.item{
																	display:flex;
																	flex-direction:column;

																	gap:14px;
																	padding: 30px 16px 26px;
																	border-radius:24px;

																	transition: transform .3s ease, box-shadow .3s ease, border-color .3s ease, background-color .3s;

																	.item:hover{
																	transform:translateY(-6px);

																	box-shadow: 0 20px 45px rgba(34,111,168,.14);

																	.item-logo{
																	width:88px;
																	height:88px;
																	border-radius:22px;
																	display:flex;
																	align-items:center;
																	justify-content:center;

																	overflow:hidden;
																	}

																	.item:hover .item-logo{
																	transform: scale(1.06) rotate(-1deg);
																	}

																	.item-logo svg{
																	width:46px;
																	height:46px;
																	}

																	.item-logo img{
																	width:100%;
																	height:100%;
																	object-fit:cover;
																	}

																	.item-title{
																	font-size:16px;
																	font-weight:800;
																	letter-spacing:-.3px;
																	color: var(--text);
																	text-align:center;
																	}

																	.item-btn{
																	display:inline-flex;
																	align-items:center;
																	gap:6px;
																	padding: 8px 16px;
																	border-radius:50px;

																	border:1px solid var(--badge-border);
																	color: var(--primary);
																	font-size:12px;
																	font-weight:800;

																	.item:hover .item-btn{

																	}

																	/* RESPONSIVE */
																	@media(max-width:680px){
																	.page{ padding: 40px 6% 60px; }

																	.item-logo{ width:56px; height:56px; border-radius:16px; flex-shrink:0; }

																	}

																</style>

			var langCodes = { tr: "TR", en: "EN", ru: "RU", de: "DE", ar: "AR" };

			function applyLanguage(lang) {
			if (!translations[lang]) lang = "tr";

			var dict = translations[lang];

			document.querySelectorAll("[data-i18n]").forEach(function(el) {
			var key = el.getAttribute("data-i18n");
			if (dict[key]) {
			el.textContent = dict[key];
			}
			});

			document.documentElement.setAttribute("lang", lang);

			document.documentElement.setAttribute("dir", lang === "ar" ? "rtl" : "ltr");

			var label = document.getElementById("langLabel");
			if (label) {
			label.textContent = langCodes[lang] || "TR";
			}

			document.querySelectorAll(".lang-menu-item").forEach(function(item) {
			item.classList.toggle("active", item.getAttribute("data-lang") === lang);
			});

			localStorage.setItem("site-lang", lang);
			}

			function toggleLangMenu(e) {
			if (e) e.stopPropagation();
			var menu = document.getElementById("langMenu");
			var btn = document.getElementById("langSwitchBtn");
			if (!menu) return;
			var willOpen = !menu.classList.contains("open");
			menu.classList.toggle("open", willOpen);
			if (btn) btn.setAttribute("aria-expanded", willOpen ? "true" : "false");
			}

			function closeLangMenu() {
			var menu = document.getElementById("langMenu");
			var btn = document.getElementById("langSwitchBtn");
			if (menu) menu.classList.remove("open");
			if (btn) btn.setAttribute("aria-expanded", "false");
			}

			function selectLanguage(lang) {
			applyLanguage(lang);
			closeLangMenu();
			}

			document.addEventListener("click", function(e) {
			var switcher = document.getElementById("langSwitcher");
			if (switcher && !switcher.contains(e.target)) {
			closeLangMenu();
			}
			});

			document.addEventListener("keydown", function(e) {
			if (e.key === "Escape") closeLangMenu();
			});

			document.addEventListener("DOMContentLoaded", function() {
			var savedLang = localStorage.getItem("site-lang") || "tr";
			applyLanguage(savedLang);
			});

			/* =========================================================
			KARANLIK MOD TIKLAMA FONKSİYONU VE İKON AYARI
			========================================================= */

			function toggleDarkMode() {
			var isDark = document.documentElement.classList.toggle("dark-mode");
			document.body.classList.toggle("dark-mode", isDark);

			var btn = document.getElementById("darkModeBtn");

			if (isDark) {
			localStorage.setItem("theme", "dark");
			if(btn) btn.innerHTML = "☀️";
			} else {
			localStorage.setItem("theme", "light");
			if(btn) btn.innerHTML = "🌙";
			}
			}

			document.addEventListener("DOMContentLoaded", function() {
			var savedTheme = localStorage.getItem("theme");
			var btn = document.getElementById("darkModeBtn");

			if (savedTheme === "dark") {
			document.documentElement.classList.add("dark-mode");
			document.body.classList.add("dark-mode");
			if(btn) btn.innerHTML = "☀️";
			} else {
			if(btn) btn.innerHTML = "🌙";
			}
			});
		</script>

	</body>
</html>
