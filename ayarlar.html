<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<script>try{document.documentElement.setAttribute("data-cvd",localStorage.getItem("cvd-theme")||"");if((localStorage.getItem("theme")||"dark")==="dark")document.documentElement.classList.add("dark-mode");}catch(e){}</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rubik Academy - Ayarlar</title>
<link rel="icon" href="/icons/favicon-48.png" type="image/png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#ffd21f">
<meta name="robots" content="noindex">
<link rel="canonical" href="https://rubikacademy.fun/ayarlar">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles/common.css?v=20261115">
<style>
.set-wrap { max-width: 520px; margin: 0 auto; }
.set-card { background: var(--surface); border: var(--card-bw) solid var(--card-border); border-radius: 22px; box-shadow: var(--shadow); padding: 18px 18px 10px; }
.set-card h1 { font-size: 26px; font-weight: 900; color: var(--text); letter-spacing: -.5px; padding: 6px 6px 14px; }
/* ayarlar menüsü (common.js raRenderSettings) burada daha büyük görünür */
#setRoot .set-grp { padding: 10px 4px; }
#setRoot .set-grp + .set-grp { border-top: 1px solid var(--border); margin-top: 6px; }
#setRoot .set-opt { padding: 12px 12px; font-size: 15.5px; border-radius: 12px; }
#setRoot .set-h { font-size: 12px; margin: 2px 8px 8px; }
</style>
</head>
<body>
<div class="bg-glow"></div>
<header class="navbar">
    <a href="/" class="nav-logo"><img class="nav-logo-mark" src="/RubikAcademyLogo.png" alt="Rubik Academy"><span class="nav-logo-text">Rubik Academy</span></a>
    <div class="nav-right">
        <nav class="nav-links"><a href="/" data-i18n="navHome">Ana Sayfa</a><a href="/icerikler" data-i18n="navContent">İçerikler</a></nav>
    </div>
</header>
<div class="page">
<div class="set-wrap">
<nav class="nav-bar"><a href="/" class="back-btn" data-i18n="back_btn">← Geri Dön</a></nav>
<div class="set-card">
    <h1 id="setH">Ayarlar</h1>
    <div id="setRoot"></div>
</div>
</div>
</div>
<footer><span data-i18n="footer">© 2026 Rubik Academy. Tüm hakları saklıdır.</span></footer>
<script src="/js/i18n.js?v=20261115"></script>
<script src="/js/common.js?v=20261115"></script>
<script>
(function () {
    function start() {
        var L = (window.SETTINGS_TXT && (SETTINGS_TXT[localStorage.getItem("site-lang") || "tr"] || SETTINGS_TXT.tr)) || null;
        if (L) document.getElementById("setH").textContent = L.set;
        if (window.raRenderSettings) window.raRenderSettings(document.getElementById("setRoot"));
    }
    if (document.readyState !== "loading") start(); else document.addEventListener("DOMContentLoaded", start);
    document.addEventListener("site-lang-change", start);
})();
</script>
</body>
</html>
