<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<script>try{if(localStorage.getItem("theme")!=="light")document.documentElement.classList.add("dark-mode")}catch(e){document.documentElement.classList.add("dark-mode")}</script>
<title>Özel Timer</title>
<link rel="icon" href="/icons/favicon-48.png" type="image/png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=JetBrains+Mono:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --t-bg:#f4f1ea; --t-surface:#ffffff; --t-soft:#efe8da; --t-text:#17171f; --t-muted:#6a6a7c;
  --t-border:#e2d8c6; --t-accent:#1d5bff; --t-green:#19a34a; --t-amber:#e8a400; --t-red:#d12d28;
}
html.dark-mode{
  --t-bg:#14151c; --t-surface:#1c1d27; --t-soft:#262836; --t-text:#f4f4f8; --t-muted:#9fa1b4;
  --t-border:#2c2f41; --t-accent:#5a86ff; --t-green:#35c46b; --t-amber:#f0b429; --t-red:#ff5b57;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--t-bg);color:var(--t-text);font-family:Inter,system-ui,sans-serif;-webkit-user-select:none;user-select:none;overflow:hidden}
button,select,input{font-family:inherit}
.hid{display:none!important}
[hidden]{display:none!important}

/* kapı */
#tGate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--t-bg);z-index:50}
.gate-card{background:var(--t-surface);border:1px solid var(--t-border);border-radius:18px;padding:30px 26px;width:min(92vw,360px);text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.gate-card h1{font-size:20px;margin:0 0 4px}
.gate-card p{color:var(--t-muted);font-size:13px;margin:0 0 18px}
.gate-card input{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--t-border);background:var(--t-bg);color:var(--t-text);font-size:16px;text-align:center;margin-bottom:12px}
.gate-card button{width:100%;padding:13px;border:0;border-radius:12px;background:var(--t-accent);color:#fff;font-weight:800;font-size:15px;cursor:pointer}
#tGateErr{color:var(--t-red);font-size:13px;min-height:18px;margin-top:8px}

/* yerleşim */
#tApp{height:100%;display:flex;flex-direction:column}
.topbar{display:flex;gap:8px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--t-border);flex-wrap:wrap;position:relative;z-index:20}
.topbar select,.topbar .tbtn{padding:8px 10px;border:1px solid var(--t-border);background:var(--t-surface);color:var(--t-text);border-radius:10px;font-size:13px;font-weight:600;cursor:pointer}
.topbar .tbtn:hover{border-color:var(--t-accent)}
.topbar .sp{flex:1}
.ico{font-size:15px;line-height:1}
.main{flex:1;display:grid;grid-template-columns:1fr 340px;grid-template-rows:auto 1fr;gap:0;min-height:0}
.scrbar{grid-column:1/3;display:flex;align-items:center;gap:14px;padding:14px 20px;border-bottom:1px solid var(--t-border)}
.scrbar .scr{flex:1;font-family:"JetBrains Mono",monospace;font-weight:700;font-size:clamp(15px,2.4vw,24px);line-height:1.5;white-space:pre-wrap;letter-spacing:.5px}
.scrbar .tn{display:grid;grid-template-columns:repeat(4,22px);grid-template-rows:repeat(3,22px);gap:2px;flex-shrink:0}
.tn-f{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:1px}
.tn-f i{width:100%;aspect-ratio:1;border-radius:1px}
#tNewScr{padding:9px 12px;border:1px solid var(--t-border);background:var(--t-surface);color:var(--t-text);border-radius:10px;cursor:pointer;font-weight:700;flex-shrink:0}

/* zamanlayıcı alanı */
#tStage{grid-column:1;grid-row:2;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;position:relative;min-height:0;touch-action:none}
#tTime{font-family:"JetBrains Mono",monospace;font-weight:800;font-size:clamp(56px,13vw,150px);line-height:1;letter-spacing:-2px;transition:color .1s}
#tStage[data-state=hold] #tTime{color:var(--t-amber)}
#tStage[data-state=ready] #tTime{color:var(--t-green)}
#tStage[data-insp] #tTime{color:var(--t-text)}
#tStage[data-warn="1"] #tTime{color:var(--t-amber)}
#tStage[data-warn="2"] #tTime{color:var(--t-red)}
#tHint{margin-top:18px;color:var(--t-muted);font-size:14px;font-weight:600;min-height:20px;text-align:center;padding:0 14px}

/* yan panel */
.side{grid-column:2;grid-row:2;border-left:1px solid var(--t-border);display:flex;flex-direction:column;min-height:0}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--t-border);border-bottom:1px solid var(--t-border)}
.tst{background:var(--t-surface);padding:9px 12px;display:flex;justify-content:space-between;align-items:baseline}
.tst span{color:var(--t-muted);font-size:12px;font-weight:600}
.tst b{font-family:"JetBrains Mono",monospace;font-size:15px}
.graphwrap{padding:10px 12px;border-bottom:1px solid var(--t-border)}
#tGraph{width:100%;height:auto;display:block}
.listwrap{flex:1;overflow:auto;min-height:0}
#tList{list-style:none;margin:0;padding:0}
#tList li{display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid var(--t-border);cursor:pointer;font-size:14px}
#tList li:hover{background:var(--t-soft)}
.tli-n{color:var(--t-muted);font-size:12px;width:34px}
.tli-t{font-family:"JetBrains Mono",monospace;font-weight:700;flex:1}
.tli-t.dnf{color:var(--t-red)}
.tli-c{color:var(--t-muted)}
.tli-empty{color:var(--t-muted);justify-content:center;cursor:default;font-size:13px}

/* ayar paneli */
#tPanel{position:fixed;top:0;right:0;height:100%;width:min(88vw,320px);background:var(--t-surface);border-left:1px solid var(--t-border);transform:translateX(100%);transition:transform .22s;z-index:30;padding:18px;overflow:auto;box-shadow:-10px 0 40px rgba(0,0,0,.2)}
#tPanel.open{transform:translateX(0)}
#tPanel h2{font-size:15px;margin:0 0 14px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--t-border);font-size:14px}
.row label{font-weight:600}
.row input[type=number]{width:74px;padding:7px;border:1px solid var(--t-border);background:var(--t-bg);color:var(--t-text);border-radius:8px;text-align:center}
.row .pbtn{padding:8px 12px;border:1px solid var(--t-border);background:var(--t-bg);color:var(--t-text);border-radius:9px;cursor:pointer;font-weight:700;font-size:13px}
.switch{position:relative;width:42px;height:24px;flex-shrink:0}
.switch input{opacity:0;width:0;height:0}
.switch i{position:absolute;inset:0;background:var(--t-border);border-radius:24px;transition:.2s}
.switch i::before{content:"";position:absolute;width:18px;height:18px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.switch input:checked + i{background:var(--t-accent)}
.switch input:checked + i::before{transform:translateX(18px)}
.panel-note{color:var(--t-muted);font-size:12px;line-height:1.5;margin-top:14px}

/* modal */
#tModal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:40;padding:16px}
#tModal .mcard{background:var(--t-surface);border:1px solid var(--t-border);border-radius:16px;padding:20px;width:min(94vw,420px)}
#tModal h3{margin:0 0 10px;font-size:16px}
#tmScr{font-family:"JetBrains Mono",monospace;font-size:13px;color:var(--t-muted);word-break:break-word;white-space:pre-wrap;margin-bottom:12px;line-height:1.5}
#tmNote{width:100%;min-height:52px;padding:8px;border:1px solid var(--t-border);background:var(--t-bg);color:var(--t-text);border-radius:9px;font-size:13px;resize:vertical;margin-bottom:12px}
.mbtns{display:flex;gap:8px;flex-wrap:wrap}
.mbtns button{flex:1;min-width:64px;padding:10px;border:1px solid var(--t-border);background:var(--t-bg);color:var(--t-text);border-radius:10px;cursor:pointer;font-weight:700;font-size:13px}
.mbtns #tm_del{color:var(--t-red);border-color:var(--t-red)}
#tmClose{background:var(--t-accent);color:#fff;border:0}

@media(max-width:860px){
  .main{grid-template-columns:1fr;grid-template-rows:auto auto 1fr}
  #tStage{grid-column:1;grid-row:2;min-height:40vh;padding:24px 0}
  .side{grid-column:1;grid-row:3;border-left:0;border-top:1px solid var(--t-border)}
  .scrbar .tn{display:none}
  .graphwrap{display:none}
  .listwrap{max-height:34vh}
}
</style>
</head>
<body>

<div id="tGate" hidden>
  <div class="gate-card">
    <h1>🔒 Özel Timer</h1>
    <p>Bu sayfa gizlidir. Devam etmek için parolanı gir.</p>
    <input id="tGateInput" type="password" autocomplete="off" placeholder="Parola" inputmode="text">
    <button id="tGateBtn">Aç</button>
    <div id="tGateErr"></div>
  </div>
</div>

<div id="tApp" hidden>
  <div class="topbar">
    <select id="tEventSel" title="Etkinlik">
      <option value="222">2x2</option><option value="333">3x3</option><option value="444">4x4</option>
      <option value="555">5x5</option><option value="666">6x6</option><option value="777">7x7</option>
      <option value="333oh">3x3 OH</option><option value="333bf">3x3 BLD</option><option value="333fm">3x3 FMC</option>
      <option value="pyram">Pyraminx</option><option value="skewb">Skewb</option><option value="mega">Megaminx</option>
    </select>
    <select id="tSessSel" title="Oturum"></select>
    <button class="tbtn" id="tSessNew" title="Yeni oturum">+ Oturum</button>
    <button class="tbtn" id="tSessRen" title="Adlandır">✎</button>
    <button class="tbtn" id="tSessClear" title="Oturumu temizle">⌫</button>
    <button class="tbtn" id="tSessDel" title="Oturumu sil">🗑</button>
    <span class="sp"></span>
    <button class="tbtn" id="tTheme" title="Tema"><span class="ico">◐</span></button>
    <button class="tbtn" id="tLock" title="Kilitle"><span class="ico">🔒</span></button>
    <button class="tbtn" id="tPanelBtn" title="Ayarlar"><span class="ico">⚙</span></button>
  </div>

  <div class="main">
    <div class="scrbar">
      <div class="scr" id="tScramble"></div>
      <div class="tn" id="tImg"></div>
      <button id="tNewScr" title="Yeni karıştırma">↻</button>
    </div>

    <div id="tStage" data-state="idle">
      <div id="tTime">0.00</div>
      <div id="tHint"></div>
    </div>

    <div class="side">
      <div class="stats" id="tStats"></div>
      <div class="graphwrap"><svg id="tGraph" viewBox="0 0 640 180" preserveAspectRatio="none"></svg></div>
      <div class="listwrap"><ul id="tList"></ul></div>
    </div>
  </div>
</div>

<div id="tPanel">
  <h2>Ayarlar</h2>
  <div class="row"><label>İnceleme (15 sn)</label><span class="switch"><input type="checkbox" id="tSetInsp"><i></i></span></div>
  <div class="row"><label>Basılı tutma (ms)</label><input type="number" id="tSetHold" min="0" max="1000" step="50"></div>
  <div class="row"><label>Çözerken süreyi gizle</label><span class="switch"><input type="checkbox" id="tSetHide"><i></i></span></div>
  <div class="row"><label>Karıştırma görseli (3x3)</label><span class="switch"><input type="checkbox" id="tSetImg"><i></i></span></div>
  <div class="row"><label>Yedeği indir</label><button class="pbtn" id="tExport">İndir</button></div>
  <div class="row"><label>Yedeği yükle</label><label class="pbtn" style="cursor:pointer">Seç<input type="file" id="tImport" accept="application/json" style="display:none"></label></div>
  <div class="row"><label>Parolayı değiştir</label><button class="pbtn" id="tPwChange">Değiştir</button></div>
  <p class="panel-note">Boşluk tuşu: tut → yeşil olunca bırak → çöz → boşlukla durdur. Dokunmatikte zamanlayıcı alanına bas-bırak. Bir çözüme dokununca +2 / DNF / not / sil açılır. Tüm veriler yalnızca bu tarayıcıda saklanır.</p>
</div>

<div id="tModal" hidden>
  <div class="mcard">
    <h3 id="tmTitle"></h3>
    <div id="tmScr"></div>
    <textarea id="tmNote" placeholder="Not (opsiyonel)"></textarea>
    <div class="mbtns">
      <button id="tm_+2">+2</button>
      <button id="tm_dnf">DNF</button>
      <button id="tm_note">Notu kaydet</button>
      <button id="tm_del">Sil</button>
      <button id="tmClose">Kapat</button>
    </div>
  </div>
</div>

<script src="/js/vendor/cubejs/cube.js"></script>
<script src="/js/timer.js"></script>
</body>
</html>
