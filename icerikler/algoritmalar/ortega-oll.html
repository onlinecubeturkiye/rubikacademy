<style>
.hero {
    max-width: 1250px;
    min-height: 220px;
    margin: 0 auto 45px;
    border-radius: 34px;
    overflow: hidden;
    position: relative;
    display: flex;
    align-items: center;
    padding: 45px 65px;
    background: linear-gradient(120deg, #eef1ff, #dbe3ff);
    border: 1px solid #cdd8fb;
    box-shadow: var(--shadow);
    transition: background 0.3s, border-color 0.3s;
}

html.dark-mode .hero {
    background: linear-gradient(120deg, #1e2247, #1e293b);
    border-color: #334155;
}

.hero::before {
    content: "";
    position: absolute;
    width: 430px;
    height: 430px;
    border-radius: 50%;
    border: 70px solid rgba(255, 255, 255, .15);
    right: -180px;
    top: -180px;
}

.hero-text { position: relative; z-index: 3; max-width: 700px; }

.hero .badge { color: var(--primary-dark); }

.hero h1 {
    font-size: clamp(36px, 4.5vw, 54px);
    line-height: 1;
    letter-spacing: -2.5px;
    font-weight: 950;
    margin-bottom: 14px;
    color: var(--text);
}

.hero h1 span { color: var(--primary-dark); }

.hero p {
    color: var(--text-soft);
    font-size: 14px;
    line-height: 1.7;
    max-width: 560px;
}

/* CASE GRID */
.subsets-wrap { max-width: 1250px; margin: 0 auto; }
.subset-block { margin-bottom: 48px; }

.subset-heading {
    font-size: 22px;
    font-weight: 900;
    letter-spacing: -0.5px;
    color: var(--text);
    margin-bottom: 18px;
    padding-left: 14px;
    border-left: 5px solid var(--primary);
}

.case-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 18px; }
@media(max-width: 850px) { .case-grid { grid-template-columns: 1fr; } }

.case-card {
    display: flex;
    gap: 16px;
    align-items: center;
    background: var(--surface);
    border: 1px solid var(--card-border);
    border-radius: 20px;
    padding: 16px;
    box-shadow: 0 8px 22px rgba(15, 23, 42, 0.05);
}

.case-card:hover {
    transform: translateY(-4px);
    border-color: #dcbb5c;
    box-shadow: 0 16px 32px rgba(180, 140, 20, .12);
}

.case-diagram {
    width: 72px;
    height: 72px;
    border-radius: 12px;
    background: var(--diagram-bg);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    flex-shrink: 0;
}

.case-diagram svg { width: 62px; height: 62px; }

.case-body { flex: 1; min-width: 0; }

.case-name {
    font-size: 14px;
    font-weight: 900;
    color: var(--text);
    margin-bottom: 6px;
    letter-spacing: -0.2px;
}

.case-alg {
    font-family: "JetBrains Mono", monospace;
    font-size: 12.5px;
    line-height: 1.55;
    color: var(--primary-dark);
    font-weight: 600;
    overflow-wrap: break-word;
}

.load-error {
    max-width: 900px;
    margin: 0 auto;
    padding: 22px;
    border-radius: 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text-soft);
    text-align: center;
    font-size: 14px;
}

@media(max-width: 1000px) { .hero { padding: 40px; } }
@media(max-width: 700px) {
    .hero { min-height: auto; padding: 34px 24px; border-radius: 27px; }
    .hero h1 { font-size: 38px; }
    .hero p { font-size: 13px; }
    .subset-heading { font-size: 19px; }
}

/* ÖĞRENME DURUMLARI */
.case-card {
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: transform .25s ease, box-shadow .25s ease, border-color .25s ease, background .25s ease;
}
.case-card:focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }

.case-card.state-learning { background: #fff8d6; border-color: #f2c94c; }
.case-card.state-known { background: #dcfce7; border-color: #22c55e; }
.case-card.state-learning:hover { border-color: #e0b12a; box-shadow: 0 16px 32px rgba(242, 201, 76, .25); }
.case-card.state-known:hover { border-color: #16a34a; box-shadow: 0 16px 32px rgba(34, 197, 94, .22); }

html.dark-mode .case-card.state-learning { background: #3a3212; border-color: #b8901f; }
html.dark-mode .case-card.state-known { background: #123524; border-color: #22a35a; }

.case-status { font-size: 11px; font-weight: 800; margin-top: 8px; display: none; }
.case-card.state-learning .case-status { display: block; color: #a16207; }
.case-card.state-known .case-status { display: block; color: #15803d; }
html.dark-mode .case-card.state-learning .case-status { color: #facc15; }
html.dark-mode .case-card.state-known .case-status { color: #4ade80; }

/* İLERLEME ÖZETİ */
.progress-summary {
    max-width: 1250px;
    margin: 0 auto 28px;
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    font-size: 13px;
    font-weight: 800;
}
.progress-summary span {
    padding: 8px 14px;
    border-radius: 999px;
    background: var(--surface);
    border: 1px solid var(--card-border);
    color: var(--text);
}

<!-- ÇEVİRİLER: /js/i18n.js içinde (PAGE_ID ile eşleşir). common.js'den ÖNCE yüklenmeli -->
<script>var PAGE_ID = "ortega-oll";</script>
<script src="/js/i18n.js"></script>
<script src="/js/common.js"></script>

<script>
/* ============================================================
   ÖĞRENME İLERLEMESİ (localStorage)
   Beyaz (boş) -> sarı (learning) -> yeşil (known) -> beyaz
   Her algoritma sayfası için PROGRESS_KEY farklı olmalı.
   ============================================================ */
var PROGRESS_KEY = "algo-progress-ortega-oll";
var STATES = ["", "learning", "known"];

var PROGRESS_TEXT = {
    tr: { learning: "Öğreniyorum", known: "Biliyorum" },
    en: { learning: "Learning",    known: "Known" },
    de: { learning: "Ich lerne",   known: "Kann ich" },
    fr: { learning: "J'apprends",  known: "Je sais" },
    ru: { learning: "Учу",         known: "Знаю" },
    ar: { learning: "أتعلم",       known: "أعرف" }
};

function currentLang() { return localStorage.getItem("site-lang") || "tr"; }
function progressText() { return PROGRESS_TEXT[currentLang()] || PROGRESS_TEXT.tr; }

function loadProgress() {
    try {
        var p = JSON.parse(localStorage.getItem(PROGRESS_KEY));
        return (p && typeof p === "object") ? p : {};
    } catch (e) { return {}; }
}
function saveProgress(p) {
    try { localStorage.setItem(PROGRESS_KEY, JSON.stringify(p)); } catch (e) {}
}

function stateOfCard(card) {
    if (card.classList.contains("state-known")) return "known";
    if (card.classList.contains("state-learning")) return "learning";
    return "";
}

function applyState(card, state) {
    card.classList.remove("state-learning", "state-known");
    if (state) card.classList.add("state-" + state);
    var s = card.querySelector(".case-status");
    if (s) s.textContent = state ? progressText()[state] : "";
}

function updateSummary() {
    var cards = document.querySelectorAll(".case-card");
    var learning = 0, known = 0;
    for (var i = 0; i < cards.length; i++) {
        var st = stateOfCard(cards[i]);
        if (st === "learning") learning++;
        if (st === "known") known++;
    }
    var t = progressText();
    var el = document.getElementById("progressSummary");
    if (el) {
        el.innerHTML =
            '<span>🟡 ' + t.learning + ': ' + learning + '</span>' +
            '<span>🟢 ' + t.known + ': ' + known + ' / ' + cards.length + '</span>';
    }
}

function refreshProgressLabels() {
    var cards = document.querySelectorAll(".case-card");
    for (var i = 0; i < cards.length; i++) applyState(cards[i], stateOfCard(cards[i]));
    updateSummary();
}

function cycleCard(card) {
    var key = card.getAttribute("data-case");
    var p = loadProgress();
    var current = p[key] || "";
    var next = STATES[(STATES.indexOf(current) + 1) % STATES.length];
    if (next) { p[key] = next; } else { delete p[key]; }
    saveProgress(p);
    applyState(card, next);
    updateSummary();
}

function escapeHtml(str) {
    return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
}

fetch("/icerikler/algoritmalar/ortega-oll.json")
    .then(function(res) {
        if (!res.ok) throw new Error("HTTP " + res.status);
        return res.json();
    })
    .then(function(data) {
        var groups = data.oll;
        var wrap = document.getElementById("subsetsWrap");
        var progress = loadProgress();
        var t = progressText();
        var html = "";

        for (var i = 0; i < groups.length; i++) {
            var group = groups[i];
            var i18nKey = "subset_" + group.subset;

            html += '<div class="subset-block">';
            html += '  <h2 class="subset-heading" data-i18n="' + i18nKey + '">' + escapeHtml(group.subset) + '</h2>';
            html += '  <div class="case-grid">';

            for (var j = 0; j < group.cases.length; j++) {
                var c = group.cases[j];
                // Kayıt anahtarı: alt grup + case adı (farklı gruplarda aynı isim çakışmasın)
                var key = group.subset + "::" + c.name;
                var st = progress[key] || "";
                var cls = "case-card" + (st ? " state-" + st : "");
                var label = st ? t[st] : "";

                html += '<div class="' + cls + '" data-case="' + escapeHtml(key) + '" role="button" tabindex="0">';
                var diag = ortegaOllSvg(c.pattern, 72);
                html += '  <div class="case-diagram" dir="ltr">' + diag + '</div>';
                html += '  <div class="case-body">';
                html += '    <div class="case-name">' + escapeHtml(c.name) + '</div>';
                html += '    <div class="case-alg" dir="ltr">' + escapeHtml(c.alg) + '</div>';

                html += '    <div class="case-status">' + escapeHtml(label) + '</div>';
                html += '  </div>';
                html += '</div>';
            }

            html += '  </div>';
            html += '</div>';
        }

        wrap.innerHTML = html;

        // Tıklama (event delegation)
        wrap.addEventListener("click", function(e) {
            // Metin seçiliyorsa (algoritma kopyalama) durumu değiştirme
            var sel = window.getSelection ? String(window.getSelection()) : "";
            if (sel.length > 0) return;
            var card = e.target.closest(".case-card");
            if (card) cycleCard(card);
        });

        // Klavye: Enter / Boşluk
        wrap.addEventListener("keydown", function(e) {
            if (e.key !== "Enter" && e.key !== " ") return;
            var card = e.target.closest(".case-card");
            if (!card) return;
            e.preventDefault();
            cycleCard(card);
        });

        applyLanguage(currentLang());
        refreshProgressLabels();
    })
    .catch(function(err) {
        var errBox = document.getElementById("loadError");
        if (errBox) errBox.style.display = "block";
        console.error("/icerikler/algoritmalar/ortega-oll.json yüklenemedi:", err);
    });

// Dil menüsünden dil değişince etiketleri güncelle
document.addEventListener("click", function(e) {
    if (e.target.closest("#langMenu")) setTimeout(refreshProgressLabels, 50);
});
</script>
