html.dark-mode .hero {

    border-color: #334155;
}

.hero::before {
    content: "";
    position: absolute;
    width: 430px;
    height: 430px;
    border-radius: 50%;

    top: -180px;

.hero-text {

    z-index: 3;

.badge {

    align-items: center;
    gap: 9px;
    padding: 9px 15px;

    border: 1px solid var(--border);
    color: var(--primary-dark);

.hero h1 {

    margin-bottom: 14px;

.hero h1 span { color: var(--primary-dark); }

.hero p {
    color: var(--text-soft);
    font-size: 14px;
    line-height: 1.7;
    max-width: 560px;
}

.subsets-wrap {

    margin: 0 auto;
}

.subset-block { margin-bottom: 48px; }

.subset-heading {
    font-size: 22px;
    font-weight: 900;
    letter-spacing: -0.5px;
    color: var(--text);
    margin-bottom: 18px;
    padding-left: 14px;
    border-left: 5px solid var(--primary);
}

.case-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 18px;
}

@media(max-width: 850px) { .case-grid { grid-template-columns: 1fr; } }

.case-card {
    display: flex;
    gap: 16px;
    align-items: center;
    background: var(--surface);
    border: 1px solid var(--card-border);
    border-radius: 20px;
    padding: 16px;
    box-shadow: 0 8px 22px rgba(15, 23, 42, 0.05);
    transition: transform .25s ease, box-shadow .25s ease, border-color .25s ease;
}

.case-card:hover {
    transform: translateY(-4px);
    border-color: #dcbb5c;
    box-shadow: 0 16px 32px rgba(180, 140, 20, .12);
}

.case-diagram {
    width: 72px;
    height: 72px;
    border-radius: 12px;
    background: var(--diagram-bg);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    flex-shrink: 0;
}

.case-diagram svg { width: 62px; height: 62px; }

.case-body { flex: 1; min-width: 0; }

.case-name {
    font-size: 14px;
    font-weight: 900;
    color: var(--text);
    margin-bottom: 6px;
    letter-spacing: -0.2px;
}

.case-alg {

    font-size: 12.5px;

.load-error {

    background: var(--surface);

<!-- Harici JSON dosyasını çekme -->
<script>
function escapeHtml(str) {
    return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

fetch("/icerikler/algoritmalar/ortega-oll.json")
    .then(function(res) {
        if (!res.ok) throw new Error("HTTP " + res.status);
        return res.json();
    })
    .then(function(data) {
        var groups = data.oll;
        var wrap = document.getElementById("subsetsWrap");
        var html = "";

        for (var i = 0; i < groups.length; i++) {
            var group = groups[i];
            var i18nKey = "subset_" + group.subset;

            html += '<div class="subset-block">';
            html += '  <h2 class="subset-heading" data-i18n="' + i18nKey + '">' + escapeHtml(group.subset) + '</h2>';
            html += '  <div class="case-grid">';

            for (var j = 0; j < group.cases.length; j++) {
                var c = group.cases[j];
                var diag = ortegaOllSvg(c.pattern, 72);

                html += '<div class="case-card">';
                html += '  <div class="case-diagram" dir="ltr">' + diag + '</div>';
                html += '  <div class="case-body">';
                html += '    <div class="case-name">' + escapeHtml(c.name) + '</div>';
                html += '    <div class="case-alg" dir="ltr">' + escapeHtml(c.alg) + '</div>';
                html += '  </div>';
                html += '</div>';
            }

            html += '  </div>';
            html += '</div>';
        }

        wrap.innerHTML = html;
        var savedLang = localStorage.getItem("site-lang") || "tr";
        applyLanguage(savedLang);
    })
    .catch(function(err) {
        var errBox = document.getElementById("loadError");
        if (errBox) errBox.style.display = "block";
        console.error("ortega-oll.json yüklenemedi:", err);
    });
</script>
