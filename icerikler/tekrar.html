<style>
.intro { text-align: center; margin: 0 auto 24px; max-width: 760px; }
.intro .badge { margin-bottom: 14px; }
.intro h1 { font-size: clamp(34px, 5vw, 54px); line-height: 1.05; letter-spacing: -1.5px; font-weight: 900; color: var(--text); margin-bottom: 14px; }
.intro h1 span { color: var(--primary); }
.intro p { color: var(--text-soft); font-size: 16px; line-height: 1.7; }
.rk-wrap { max-width: 760px; margin: 0 auto 40px; }
.tk-box { background: var(--surface); border: var(--card-bw) solid var(--card-border); border-radius: 22px; padding: 16px; box-shadow: var(--shadow-sm); }
.tk-cta { text-align: center; margin-top: 16px; font-size: 14px; color: var(--text-soft); }
.tk-cta a { color: var(--ui-accent); font-weight: 800; }
.rk-tabs { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-bottom: 10px; }
.rk-tabs button { border: var(--card-bw) solid var(--card-border); background: var(--surface); color: var(--text); font: 800 14px Inter, sans-serif; padding: 9px 16px; border-radius: 999px; cursor: pointer; }
.rk-tabs button.on { background: var(--ui-accent); color: var(--ui-accent-text); border-color: transparent; }
.rk-box { background: var(--surface); border: var(--card-bw) solid var(--card-border); border-radius: 22px; padding: 10px; box-shadow: var(--shadow-sm); margin-top: 14px; }
.rk-row { display: flex; align-items: center; gap: 12px; padding: 11px 12px; border-radius: 14px; text-decoration: none; color: var(--text); }
.rk-row:nth-child(odd) { background: var(--surface-soft); }
.rk-row.me { outline: 2px solid var(--ui-accent); }
.rk-n { width: 40px; flex: none; text-align: center; font: 900 16px "JetBrains Mono", monospace; color: var(--text-soft); }
.rk-row:nth-child(-n+3) .rk-n { font-size: 22px; }
.rk-name { flex: 1; min-width: 0; font-weight: 800; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rk-name small { display: block; font-weight: 700; font-size: 12px; color: var(--text-soft); }
.rk-t { font: 900 18px "JetBrains Mono", monospace; }
.rk-empty { text-align: center; padding: 28px 12px; color: var(--text-soft); line-height: 1.6; }
.rk-empty a, .rk-note a { color: var(--ui-accent); font-weight: 800; }
.rk-note { text-align: center; margin-top: 14px; font-size: 13.5px; color: var(--text-soft); line-height: 1.6; }
</style>

<script>
(function () {
    var box = document.getElementById("tkBox");
    function show() {
        var r = SolveReplay.decode(location.hash);
        if (!r || !SolveReplay.ok(r)) { box.innerHTML = '<p style="text-align:center;color:var(--text-soft);padding:20px">Bu bağlantıda çözüm bulunamadı. Çözüm Analizi\'nde bir çözümün altındaki <b>🔗 Çözümü paylaş</b> ile bağlantı oluşturabilirsin.</p>'; return; }
        document.title = "Çözüm " + SolveReplay.fmt(r.t) + " — Rubik Academy";
        SolveReplay.mount(box, r);
    }
    show();
    window.addEventListener("hashchange", show);
})();
</script>
