<style>
.intro { text-align: center; margin: 0 auto 24px; max-width: 760px; }

.ls-progress a { color: var(--ui-accent); font-weight: 800; }

.ls-item { display: flex; align-items: center; gap: 12px; padding: 12px 14px; margin-bottom: 8px; border-radius: 14px; background: var(--surface); border: var(--card-bw) solid var(--card-border); color: var(--text); text-decoration: none; box-shadow: var(--shadow-sm); }

.ls-item.done .ls-no { background: #16a34a; color: #fff; }
.ls-t { flex: 1; min-width: 0; font-weight: 800; }
.ls-t small { display: block; font-size: 12px; font-weight: 700; color: var(--text-soft); }
.ls-go { color: var(--text-soft); font-weight: 900; }
.ls-lesson { background: var(--surface); border: var(--card-bw) solid var(--card-border); border-radius: 22px; padding: 20px; margin-bottom: 22px; box-shadow: var(--shadow); }
.ls-back { display: inline-block; margin-bottom: 10px; color: var(--text-soft); font-weight: 800; font-size: 14px; text-decoration: none; }

.ls-lesson h2 { font-size: clamp(24px, 4vw, 32px); font-weight: 900; color: var(--text); margin: 6px 0 14px; letter-spacing: -.5px; }
.ls-lesson p { color: var(--text-soft); font-size: 15.5px; line-height: 1.75; margin: 0 0 12px; }
.ls-lesson p b { color: var(--text); }
.ls-lesson code { font: 700 14px "JetBrains Mono", monospace; color: var(--primary); white-space: nowrap; }
.ls-learn { background: var(--surface-soft); border-radius: 14px; padding: 12px 16px; margin-bottom: 14px; }
.ls-learn b { font-size: 13px; text-transform: uppercase; letter-spacing: .4px; color: var(--text); }
.ls-learn ul { margin: 6px 0 0 18px; padding: 0; color: var(--text-soft); line-height: 1.7; }
.ls-demo { text-align: center; margin: 14px 0; padding: 10px; border-radius: 16px; background: var(--surface-soft); }
.ls-stage { min-height: 260px; display: flex; align-items: center; justify-content: center; color: var(--text-soft); font-weight: 700; }
.ls-player { width: 100%; max-width: 380px; height: 280px; }
.ls-demo code { display: block; margin-top: 6px; white-space: normal; }
.ls-tip { background: rgba(108, 92, 231, .12); border: 1px solid rgba(108, 92, 231, .35); color: var(--text); border-radius: 14px; padding: 10px 14px; font-size: 14.5px; line-height: 1.6; margin: 12px 0; }
.ls-go-row { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0; }
.ls-btn { display: inline-flex; align-items: center; padding: 10px 14px; border-radius: 12px; font: 800 14px Inter, sans-serif; text-decoration: none; cursor: pointer; border: 1px solid var(--border); background: var(--surface-soft); color: var(--text); }
.ls-btn.main { background: var(--ui-accent); color: var(--ui-accent-text); border-color: transparent; }
.ls-btn.ghost { background: transparent; }
.ls-nav { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center; margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--border); }
.ls-nav a:first-child { justify-self: start; } .ls-nav a:last-child { justify-self: end; }
.ls-nav .ls-btn.ghost { font-size: 13px; color: var(--text-soft); }
