<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<script>try{document.documentElement.setAttribute("data-cvd",localStorage.getItem("cvd-theme")||"");if((localStorage.getItem("theme")||"dark")==="dark")document.documentElement.classList.add("dark-mode");}catch(e){}</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>
  (function() {
    var savedTheme = localStorage.getItem("theme");
    if (savedTheme === "dark") { document.documentElement.classList.add("dark-mode"); }
    var savedLang = localStorage.getItem("site-lang") || "tr";
    document.documentElement.setAttribute("lang", savedLang);
    document.documentElement.setAttribute("dir", savedLang === "ar" ? "rtl" : "ltr");
  })();
  window.RA_ACCOUNT_EAGER = true; // admin paneli için oturum hemen yüklensin
</script>
<title>Rubik Academy - Yönetim</title>
<link rel="icon" href="/icons/favicon-48.png" type="image/png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">

<style>
.wrap { max-width: 1040px; margin: 0 auto; }
body { overflow-x: hidden; }
.box, .u-card, .u-detailwrap, .sec-body { max-width: 100%; overflow-x: hidden; }
.box { background: var(--surface); border: var(--card-bw) solid var(--card-border); border-radius: 22px; box-shadow: var(--shadow); padding: 20px 22px; margin-bottom: 20px; }
.box h2 { font-size: 20px; font-weight: 850; color: var(--text); margin-bottom: 12px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.a-h1 { font-size: clamp(28px, 4vw, 40px); font-weight: 900; letter-spacing: -1px; color: var(--text); margin-bottom: 4px; }
.a-sub { color: var(--text-soft); font-size: 14px; margin-bottom: 18px; }
.a-btn { padding: 9px 14px; border-radius: 12px; border: var(--card-bw) solid var(--ink); background: var(--surface); color: var(--text); font-weight: 800; font-size: 13.5px; box-shadow: var(--shadow-sm); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.a-btn.main { background: var(--cube-yellow); color: #17171f; }
.a-btn.danger { color: var(--cube-red); border-color: var(--cube-red); }
.a-btn.sm { padding: 5px 10px; font-size: 12px; border-radius: 10px; }
.a-btn:disabled { opacity: .5; cursor: default; }
.a-row { display: grid; grid-template-columns: 34px minmax(0,1fr) auto auto; gap: 10px; align-items: center; padding: 8px 6px; border-bottom: 1px solid var(--border); font-size: 14.5px; }
.a-row .rk { font: 900 13px Inter, sans-serif; color: var(--text-soft); text-align: center; }
.a-row .nm { font-weight: 700; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.a-row .tm { font: 800 15px "JetBrains Mono", monospace; color: var(--text); }
.a-ctrl { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
.a-ctrl input { padding: 8px 11px; border-radius: 10px; border: var(--card-bw) solid var(--ink); background: var(--surface); color: var(--text); font: 700 14px Inter, sans-serif; }
.a-note { color: var(--text-soft); font-size: 13px; line-height: 1.6; }
.a-msg { font-size: 13px; font-weight: 800; min-height: 16px; margin-top: 6px; }
.a-msg.ok { color: var(--cube-green); } .a-msg.bad { color: var(--cube-red); }
.u-card { border: var(--card-bw) solid var(--border); border-radius: 14px; background: var(--surface-soft); padding: 12px 14px; margin-bottom: 10px; }
.u-top { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.u-ava { width: 40px; height: 40px; border-radius: 12px; border: 1.5px solid var(--ink); background: var(--tint-blue); display: grid; place-items: center; font: 900 16px Inter; color: var(--text); overflow: hidden; flex-shrink: 0; }
.u-ava img { width: 100%; height: 100%; object-fit: cover; }
.u-id { flex: 1; min-width: 160px; }
.u-id { min-width: 0; }
.u-id b { color: var(--text); font-size: 15px; display: block; overflow-wrap: anywhere; }
.u-id small { color: var(--text-soft); font-size: 12px; font-family: "JetBrains Mono", monospace; display: block; overflow-wrap: anywhere; word-break: break-all; }
.u-stat { overflow-wrap: anywhere; }
.u-stat { font-size: 12.5px; color: var(--text-soft); margin-top: 2px; }
.u-detail { margin-top: 10px; border-top: 1px solid var(--border); padding-top: 10px; display: none; }
.u-card.open .u-detail { display: block; }
.u-split { display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 16px; align-items: start; }
.u-picker { display: flex; flex-direction: column; gap: 6px; max-height: 70vh; overflow-y: auto; }
.u-pick { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 8px 10px; border-radius: 12px; border: var(--card-bw) solid var(--border); background: var(--surface-soft); color: var(--text); cursor: pointer; }
.u-pick:hover { border-color: var(--ink); }
.u-pick.on { border-color: var(--cube-yellow); background: var(--tint-yellow, rgba(255,210,31,.18)); }
.u-ava.sm { width: 32px; height: 32px; border-radius: 10px; font-size: 14px; }
.u-pick-id { min-width: 0; }
.u-pick-id b { display: block; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.u-pick-id small { font-size: 11px; color: var(--text-soft); }
.role-badge { display: inline-block; margin-top: 3px; padding: 1px 7px; border-radius: 999px; font-size: 10.5px; font-weight: 800; color: #fff; }
.role-badge.gelistirici { background: var(--cube-blue, #2c6fe6); }
.role-badge.tester { background: var(--cube-green, #179e4f); }
#roleSel { padding: 8px 11px; border-radius: 10px; border: var(--card-bw) solid var(--ink); background: var(--surface); color: var(--text); font: 700 14px Inter, sans-serif; }
.u-detailwrap .u-detail { display: block; }
@media (max-width: 720px) { .u-split { grid-template-columns: 1fr; } .u-picker { flex-direction: row; flex-wrap: wrap; max-height: none; } .u-pick { width: auto; } .u-pick-id small { display: none; } }
.u-detail h4 { font-size: 13px; font-weight: 850; color: var(--text); margin: 8px 0 4px; }
.v-row { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; color: var(--text-soft); padding: 3px 0; border-bottom: 1px dashed var(--border); }
.v-row .vp { font-family: "JetBrains Mono", monospace; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pill { display: inline-block; padding: 2px 8px; border-radius: 999px; background: var(--tint-blue); color: var(--text); font-size: 11.5px; font-weight: 800; margin: 2px 4px 2px 0; }
.pill.k { background: var(--tint-green); }
.pill.l { background: var(--tint-yellow, rgba(255,210,31,.3)); }
.pill-wrap { display: flex; flex-wrap: wrap; gap: 2px; }
.info-grid { display: grid; grid-template-columns: 1fr; gap: 2px; margin-top: 4px; }
.ir { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 6px 0; border-bottom: 1px dashed var(--border); font-size: 13px; min-width: 0; }
.ir > span { color: var(--text-soft); font-weight: 700; flex-shrink: 0; }
.ir > b { color: var(--text); text-align: right; min-width: 0; overflow-wrap: anywhere; word-break: break-word; }
.mono { font-family: "JetBrains Mono", monospace; overflow-wrap: anywhere; } .mono.small { font-size: 11px; word-break: break-all; }
details.sec { border: 1px solid var(--border); border-radius: 12px; padding: 8px 12px; margin-top: 10px; background: var(--surface); }
details.sec > summary, details.m-set > summary { cursor: pointer; font-size: 14px; }
details.sec[open] > summary { margin-bottom: 8px; }
.sec-body { max-height: 320px; overflow-y: auto; }
details.m-set { padding: 5px 0; border-bottom: 1px dashed var(--border); }
details.m-set > summary { font-size: 12.5px; }
.m-pills { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 2px; }
.a-gate { text-align: center; padding: 30px 16px; }
.a-gate h1 { font-size: 24px; font-weight: 900; color: var(--text); margin-bottom: 8px; }
.a-gate p { color: var(--text-soft); margin-bottom: 14px; }
@media (max-width: 640px) { .a-row { grid-template-columns: 28px minmax(0,1fr) auto; } .a-row .pen-tag { display: none; } }
</style>
</head>
