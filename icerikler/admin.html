<style>
.wrap { max-width: 1040px; margin: 0 auto; }
body { overflow-x: hidden; }
.box, .u-card, .u-detailwrap, .sec-body { max-width: 100%; overflow-x: hidden; }
.box { background: var(--surface); border: var(--card-bw) solid var(--card-border); border-radius: 22px; box-shadow: var(--shadow); padding: 20px 22px; margin-bottom: 20px; }

.a-btn { padding: 9px 14px; border-radius: 12px; border: var(--card-bw) solid var(--ink); background: var(--surface); color: var(--text); font-weight: 800; font-size: 13.5px; box-shadow: var(--shadow-sm); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.a-btn.main { background: var(--ui-accent); color: var(--ui-accent-text); }

.a-row2 { display: flex; gap: 10px; align-items: center; padding: 9px 6px; border-bottom: 1px solid var(--border); font-size: 14px; }

.a-row .nm { font-weight: 700; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
