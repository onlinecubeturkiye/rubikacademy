<style>
.wrap { max-width: 920px; margin: 0 auto; }
.box { background: var(--surface); border: var(--card-bw) solid var(--card-border); border-radius: 22px; box-shadow: var(--shadow); padding: 22px 24px; margin-bottom: 20px; }
.p-head { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }

.p-id { flex: 1; min-width: 180px; }

.p-id .p-meta { color: var(--text-soft); font-size: 12.5px; margin-top: 6px; font-weight: 700; }
.p-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
.p-btn { padding: 10px 15px; border-radius: 12px; border: var(--card-bw) solid var(--ink); background: var(--surface); color: var(--text); font-weight: 800; font-size: 14px; box-shadow: var(--shadow-sm); cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 7px; }
.p-btn.main { background: var(--ui-accent); color: var(--ui-accent-text); }
.p-btn.danger { color: var(--cube-red); border-color: var(--cube-red); }
.p-btn:hover { transform: translate(-1px, -1px); }
.stat-tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 12px; }
.stat-tile { border: var(--card-bw) solid var(--border); border-radius: 16px; background: var(--surface-soft); padding: 14px; text-align: center; }
.stat-tile b { display: block; font: 800 24px "JetBrains Mono", monospace; color: var(--text); }
.stat-tile span { font-size: 12px; font-weight: 700; color: var(--text-soft); }
.p-sets { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
.p-set { border: var(--card-bw) solid var(--border); border-radius: 14px; background: var(--surface-soft); padding: 12px 14px; }
.p-set-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 7px; }
.p-set-top b { font-size: 15px; color: var(--text); }
.p-set-top span { font-size: 12.5px; font-weight: 700; color: var(--text-soft); }
.p-bar { height: 8px; border-radius: 8px; background: var(--border); overflow: hidden; }

.p-bar i.l { background: var(--cube-yellow); }
.p-note { color: var(--text-soft); font-size: 14px; line-height: 1.6; }
.p-daily { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.p-drow { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 9px 12px; border: 1.5px solid var(--border); border-radius: 12px; background: var(--surface-soft); }
.p-drow span { font-size: 12.5px; font-weight: 700; color: var(--text-soft); }
.p-drow b { font: 800 15px "JetBrains Mono", monospace; color: var(--text); }
.p-edit { display: grid; gap: 10px; margin-top: 10px; }
.p-edit input, .p-edit textarea, .p-edit select { width: 100%; box-sizing: border-box; padding: 11px 12px; border-radius: 12px; border: 1.5px solid var(--border); background: var(--surface-soft); color: var(--text); font: 600 15px Inter, sans-serif; }
.p-fld label { display: block; font-size: 12.5px; font-weight: 800; color: var(--text-soft); margin-bottom: 6px; }
.p-photo { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.p-ava.sm { width: 56px; height: 56px; border-radius: 16px; font-size: 22px; flex-shrink: 0; }
.p-photo label.p-btn { cursor: pointer; }
.p-accents { display: flex; gap: 8px; flex-wrap: wrap; }
.p-acc { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--border); cursor: pointer; padding: 0; }
.p-acc.on { outline: 2px solid var(--text); outline-offset: 2px; }
.p-edit textarea { min-height: 54px; resize: vertical; }
.p-msg { font-size: 13px; font-weight: 700; color: var(--cube-green); min-height: 16px; }
.p-badge { display: inline-block; vertical-align: middle; margin-left: 8px; padding: 3px 11px; border-radius: 999px; font-size: 13px; font-weight: 800; color: #fff; letter-spacing: 0; }
.p-badge.dev { background: var(--cube-blue, #2c6fe6); }
.p-badge.test { background: var(--cube-green, #179e4f); }
.p-badge.org { background: #e8573a; }
.p-badge.member { background: var(--text-soft, #6b7280); }
.p-follow { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.p-fitem { display: flex; align-items: center; gap: 9px; padding: 8px 10px; border: 1.5px solid var(--border); border-radius: 12px; background: var(--surface-soft); color: var(--text); text-decoration: none; font-weight: 700; font-size: 14px; overflow: hidden; }
.p-fitem:hover { border-color: var(--ui-accent); }
.p-fitem b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.p-fava { width: 30px; height: 30px; border-radius: 9px; border: 1.5px solid var(--ink); background: var(--tint-blue); display: grid; place-items: center; font-weight: 900; font-size: 13px; overflow: hidden; flex-shrink: 0; }
.p-fava img { width: 100%; height: 100%; object-fit: cover; }
.p-signin { text-align: center; padding: 20px; }
.p-signin p { color: var(--text-soft); margin-bottom: 14px; }
