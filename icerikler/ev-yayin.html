<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<title>Yayın ekranı · Ev yarışması · Rubik Academy</title>
<link rel="icon" href="/icons/favicon-48.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800;900&family=JetBrains+Mono:wght@700;800&display=swap" rel="stylesheet">
<!--
  Ev yarışması YAYIN EKRANI (OBS / ikinci ekran için). Site menüsü, reklam ve açılır pencere yok.
  /icerikler/ev-yayin?ev=KOD — yalnız o anki turun süreleri; 2 sn'de bir yenilenir.
  ?arka=yesil → yeşil perde (chroma key), ?arka=seffaf → saydam arka plan (OBS tarayıcı kaynağı)
-->
<style>
:root { --bg: #0b0d14; --card: rgba(255, 255, 255, .055); --card2: rgba(255, 255, 255, .09); --line: rgba(255, 255, 255, .1); --text: #eef0f7; --soft: #a4aabe; --acc: #6c5ce7; --pink: #e84393; --gold: #f5c542; --good: #22c55e; --bad: #f87171; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text); font-family: Inter, system-ui, sans-serif; overflow: hidden; font-size: clamp(12px, 1.05vw, 22px); }
body.green { background: #00b140; } body.clear { background: transparent; }
body:not(.green):not(.clear)::before { content: ""; position: fixed; inset: 0; pointer-events: none;
  background: radial-gradient(40% 50% at 8% 0%, rgba(108, 92, 231, .35), transparent 70%), radial-gradient(40% 50% at 100% 100%, rgba(232, 67, 147, .25), transparent 70%); }
.wrap { position: relative; height: 100vh; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 1.1em; padding: 1.4em 1.8em 1.6em; }
/* üst bar */
.top { display: flex; align-items: center; gap: 1em; }
.top img { width: 2.6em; height: 2.6em; border-radius: .7em; background: #151826; padding: .3em; }
.top .t1 { min-width: 0; flex: 1; }
.top h1 { margin: 0; font-size: 1.9em; font-weight: 900; letter-spacing: -.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top small { display: block; color: var(--soft); font-weight: 800; font-size: .95em; margin-top: .1em; }
.chip { display: inline-flex; align-items: center; gap: .45em; padding: .45em 1em; border-radius: 99px; font-weight: 900; font-size: 1.05em; background: var(--card2); border: 1px solid var(--line); white-space: nowrap; }
.chip.live::before { content: ""; width: .6em; height: .6em; border-radius: 50%; background: #ef4444; box-shadow: 0 0 0 .25em rgba(239, 68, 68, .25); animation: blink 1.4s infinite; }
@keyframes blink { 50% { opacity: .35; } }
/* ana alan */
.main { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr); gap: 1.1em; min-height: 0; }
.spot { position: relative; border-radius: 1.4em; padding: 1.6em 1.8em; background: linear-gradient(135deg, rgba(108, 92, 231, .32), rgba(232, 67, 147, .18)); border: 2px solid rgba(162, 155, 254, .35); display: flex; flex-direction: column; justify-content: center; min-height: 0; overflow: hidden; }
.spot.pop { animation: pop .5s ease-out; }
@keyframes pop { from { transform: scale(.98); box-shadow: 0 0 0 .6em rgba(162, 155, 254, .35); } }
.spot .k { font-weight: 900; letter-spacing: .14em; font-size: .9em; color: #c9c3ff; text-transform: uppercase; }
.spot .nm { font-size: 3.4em; font-weight: 900; letter-spacing: -.03em; line-height: 1.05; margin: .15em 0 .1em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.spot .big { font: 800 6.4em/1 "JetBrains Mono", monospace; letter-spacing: -.04em; margin: .05em 0 .12em; }
.spot .big.dnf { color: var(--bad); }
.spot .row { display: flex; flex-wrap: wrap; gap: .5em; align-items: center; }
.tm { font: 800 1.35em "JetBrains Mono", monospace; padding: .25em .6em; border-radius: .55em; background: rgba(0, 0, 0, .28); border: 1px solid var(--line); }
.tm.e { color: rgba(255, 255, 255, .25); } .tm.dnf { color: var(--bad); } .tm.best { color: var(--good); } .tm.new { border-color: #fff; box-shadow: 0 0 0 2px rgba(255, 255, 255, .5); }
.spot .avg { margin-left: auto; text-align: right; }
.spot .avg span { display: block; font-weight: 900; color: var(--soft); font-size: .9em; letter-spacing: .08em; }
.spot .avg b { font: 800 2.4em "JetBrains Mono", monospace; }
.spot .medal { position: absolute; top: .5em; right: .7em; font-size: 4em; }
.rank { border-radius: 1.4em; background: var(--card); border: 1px solid var(--line); padding: 1.1em 1.1em .8em; display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
.rank h2 { margin: 0 0 .55em; font-size: 1.05em; letter-spacing: .12em; color: var(--soft); font-weight: 900; }
.rk { display: grid; grid-template-columns: 2em minmax(0, 1fr) auto; align-items: center; gap: .6em; padding: .5em .6em; border-radius: .8em; font-size: 1.25em; }
.rk:nth-child(odd) { background: rgba(255, 255, 255, .035); }
.rk .p { font-weight: 900; color: var(--soft); text-align: center; }
.rk.r1 .p { color: var(--gold); } .rk.r1 { background: rgba(245, 197, 66, .12); }
.rk .n { font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rk .a { font: 800 1em "JetBrains Mono", monospace; }
.rk .a small { color: var(--soft); font-size: .7em; margin-left: .3em; }
/* alt: diğer yarışmacılar */
.others { display: grid; grid-template-columns: repeat(auto-fill, minmax(15em, 1fr)); gap: .7em; max-height: 34vh; overflow: hidden; align-content: start; }
.oc { border-radius: 1em; background: var(--card); border: 1px solid var(--line); padding: .65em .8em; min-width: 0; }
.oc.hot { border-color: rgba(162, 155, 254, .7); background: rgba(108, 92, 231, .16); }
.oc .h { display: flex; align-items: baseline; gap: .5em; }
.oc .h b { font-weight: 900; font-size: 1.1em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
.oc .h i { font-style: normal; font: 800 1.05em "JetBrains Mono", monospace; }
.oc .h em { font-style: normal; color: var(--soft); font-weight: 900; font-size: .85em; }
.oc .ts { display: flex; flex-wrap: wrap; gap: .3em; margin-top: .4em; }
.oc .ts span { font: 700 .85em "JetBrains Mono", monospace; padding: .1em .4em; border-radius: .4em; background: rgba(0, 0, 0, .25); color: var(--soft); }
.oc .ts span.dnf { color: var(--bad); } .oc .ts span.best { color: var(--good); } .oc .ts span.e { opacity: .35; }
.msg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; font-size: 1.6em; font-weight: 800; color: var(--soft); padding: 2em; }
.scr { color: var(--soft); font: 700 .95em "JetBrains Mono", monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.recb { display: inline-block; margin-left: .5em; padding: .15em .6em; border-radius: 99px; background: linear-gradient(120deg,#ff8a1f,#e84393); color: #fff; font-weight: 900; font-size: .55em; letter-spacing: .04em; vertical-align: middle; }
.rec { color: var(--soft); font-weight: 800; }
.prep { font: 800 4.2em "JetBrains Mono", monospace; }
@media (max-aspect-ratio: 1/1) { body { overflow: auto; font-size: 13px; } .wrap { height: auto; } .main { grid-template-columns: 1fr; } .others { max-height: none; } }
</style>
</head>
<body>
<div class="wrap" id="w">
    <div class="msg" id="msg">Yükleniyor…</div>
</div>
<script src="/js/firebase-config.js?v=20270102"></script>
<script src="/js/comp-share.js?v=20270102"></script>
<script src="/js/ev-yayin.js?v=20270102"></script>
</body>
</html>
