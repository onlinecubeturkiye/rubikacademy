	<style>

		html {
			overflow-x: hidden;
			scroll-behavior: smooth;
		}

		.page{
			width:100%;
			min-height:100vh;
			padding: 30px 5% 90px;
			background: transparent;
		}

		/* =========================================================
		BAŞLIK
		========================================================= */

		.intro{
			max-width:850px;
			margin:0 auto 55px;
			text-align:center;
		}

		.intro-badge{
			display:inline-flex;
			align-items:center;
			gap:9px;
			padding:9px 17px;
			border-radius:50px;
			background: var(--badge-bg);
			border: var(--card-bw) solid var(--badge-border);
			color: var(--text);
			font-size:11px;
			font-weight:800;
			letter-spacing:1.7px;
			margin-bottom:18px;
			box-shadow: var(--shadow-sm);
		}

		.intro-badge i{
			width:7px;
			height:7px;
			display:block;
			border-radius: 2px;
			background: var(--cube-red);
			
		}

		.intro h1{
			font-size: clamp(40px,5vw,65px);
			line-height:1;
			letter-spacing:-3px;
			font-weight:900;
			color: var(--text);
			margin-bottom:18px;
		}

		.intro h1 span{
			color: var(--text);
		}

		.intro p{
			max-width:700px;
			margin:auto;
			color: var(--text-soft);
			line-height:1.8;
			font-size:15px;
		}

		/* =========================================================
		GRID & KARTLAR
		========================================================= */

		.cards{
			width:100%;
			max-width:1350px;
			margin:auto;
			display:grid;
			grid-template-columns: repeat(3,1fr);
			gap:28px;
		}

		.card{
			position:relative;
			overflow:hidden;
			border-radius:28px;
			background: var(--surface);
			border: var(--card-bw) solid var(--card-border);
			box-shadow: var(--shadow);
			transition: transform .35s ease, box-shadow .35s ease, border-color .35s ease, background-color 0.3s;
		}

		.card:hover{
			transform: translate(-3px, -3px);
			box-shadow: var(--shadow-hover);
		}

		.visual{
			height:355px;
			position:relative;
			overflow:hidden;
			display:flex;
			align-items:center;
			justify-content:center;
			isolation:isolate;
			border-bottom: var(--card-bw) solid var(--card-border);
		}

		.visual::before{
			content:"";
			position:absolute;
			width:390px;
			height:390px;
			border-radius:50%;
			border: 55px solid rgba(255,255,255,.25);
			top:-190px;
			left:-130px;
			z-index:-3;
		}

		.visual::after{
			content:"";
			position:absolute;
			width:190px;
			height:190px;
			border-radius:45px;
			background: rgba(255,255,255,.19);
			right:-75px;
			bottom:-80px;
			transform:rotate(32deg);
			z-index:-3;
		}

		/* ARKA PLAN RENKLERİ */
		.blue{ background: var(--tint-blue); }
		.purple{ background: var(--tint-purple); }
		.cyan{ background: var(--tint-blue); }
		.green{ background: var(--tint-green); }
		.red{ background: var(--tint-red); }
		.pink{ background: var(--tint-red); }
		.orange{ background: var(--tint-orange); }
		.yellow{ background: var(--tint-yellow); }
		.navy{ background: var(--tint-blue); }
		.teal{ background: var(--tint-green); }

		/* NUMARA VE ETİKETLER */
		.number{
			position:absolute;
			top:20px;
			left:20px;
			z-index:30;
			padding: 8px 12px;
			border-radius:11px;
			background: var(--surface);
			border: var(--card-bw) solid var(--card-border);
			font-size:11px;
			font-weight:900;
			color: var(--text);
		}

		.visual-label{
			position:absolute;
			bottom:18px;
			left:20px;
			z-index:30;
			padding: 9px 13px;
			border-radius:10px;
			background: var(--surface);
			font-size:10px;
			font-weight:900;
			letter-spacing:1.3px;
			color: var(--text);
			border: var(--card-bw) solid var(--card-border);
		}

		/* OYNAT ROZETİ (video ipucu) */
		.play-badge{
			position:absolute;
			top:20px;
			right:20px;
			z-index:30;
			width:34px;
			height:34px;
			border-radius:50%;
			background: var(--surface);
			display:flex;
			align-items:center;
			justify-content:center;
			border: var(--card-bw) solid var(--card-border);
			color: var(--text);
		}

		.play-badge svg{
			width:13px;
			height:13px;
			fill: var(--text);
			margin-left:2px;
		}

		.cube-wrap{
			width:260px;
			height:260px;
			position:relative;
			display:flex;
			align-items:center;
			justify-content:center;
			transition: transform .5s cubic-bezier(.2,.8,.2,1);
		}

		.card:hover .cube-wrap{
			transform: translateY(-8px) scale(1.06) rotate(-1deg);
		}

		.cube-svg{
			width:100%;
			height:100%;
			overflow:visible;
			filter: drop-shadow(0 25px 18px rgba(16,36,58,.24));
		}

		.info{
			padding: 24px 26px 27px;
		}

		.tag{
			display:inline-block;
			padding: 6px 10px;
			border-radius:7px;
			background: var(--badge-bg);
			color: var(--text);
			font-size:9px;
			font-weight:900;
			letter-spacing:1px;
			margin-bottom:11px;
		}

		.info h2{
			font-size:22px;
			font-weight:850;
			letter-spacing:-.5px;
			color: var(--text);
			margin-bottom:8px;
		}

		.info p{
			font-size:13px;
			line-height:1.65;
			color: var(--text-soft);
			min-height:43px;
			margin-bottom:17px;
		}

		.start{
			display:inline-flex;
			align-items:center;
			gap:7px;
			color: var(--primary);
			font-size:13px;
			font-weight:800;
			transition: gap .25s ease;
		}

		.card:hover .start{
			gap:12px;
		}

		.special{
			width:250px;
			height:250px;
			transition: transform .5s ease;
			filter: drop-shadow(0 25px 18px rgba(15,30,50,.20));
		}

		.card:hover .special{
			transform: translateY(-9px) scale(1.06);
		}

		.pyraminx-svg{ width:230px; height:230px; }
		.skewb-svg{ width:240px; height:240px; }
		.square-svg{ width:240px; height:240px; }
		.megaminx-svg{ width:250px; height:250px; }
		.clock-svg{ width:245px; height:245px; }
		.fto-svg{ width:240px; height:240px; }

		/* =========================================================
		ALT BANNER
		========================================================= */

		.bottom{
			width:100%;
			max-width:1350px;
			margin: 45px auto 0;
			padding: 35px 25px;
			border-radius:25px;
			text-align:center;
			background: var(--bottom-bg);
			border: var(--card-bw) solid var(--bottom-border);
			transition: background-color 0.3s, border-color 0.3s;
		}

		.bottom h3{
			font-size:24px;
			font-weight:850;
			color: var(--bottom-text);
			margin-bottom:8px;
		}

		.bottom p{
			font-size:13px;
			line-height:1.7;
			color: var(--text-soft);
		}

		/* RESPONSIVE */
		@media(max-width:1050px){
			.cards{ grid-template-columns: repeat(2,1fr); }
		}

		@media(max-width:680px){
			.page{ padding: 22px 4% 60px; }
			.intro{ margin-bottom:35px; }
			.intro h1{ font-size:40px; }
			.intro p{ font-size:14px; }
			.cards{ grid-template-columns:1fr; gap:22px; }
			.visual{ height:330px; }
			.card{ border-radius:23px; }
		}

		@media(max-width:390px){
			.visual{ height:310px; }
			.cube-wrap{ width:230px; height:230px; }
			.special{ width:220px; height:220px; }
		}

	
		.vt{max-width:820px;margin:0 auto}
		.vt-tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
		.vt-tab{flex:0 0 auto;border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:999px;padding:8px 14px;font:700 14px Inter,sans-serif;cursor:pointer}
		.vt-tab.on{background:var(--text);color:var(--surface);border-color:var(--text)}
		.vt-panel{margin-top:14px;border:1px solid var(--border);border-radius:16px;background:var(--surface);padding:22px}
		.vt-panel h2{margin:0 0 6px;font-size:22px;color:var(--text)}
		.vt-panel p{margin:0 0 10px;color:var(--text-soft)}
		.vt-soon{font-weight:600}
		.vt-yt{display:inline-block;margin-top:4px;font-weight:700;color:var(--text)}
	</style>

</head>

	<div class="page">

		<!-- ======================================================

		<section class="intro">

			<div class="intro-badge">
				<i></i>
				RUBIK ACADEMY
			</div>

			<h1>
				<span data-i18n="ic_title1">Video</span>
				<span data-i18n="ic_titleAccent">Eğitimleri</span>
			</h1>

			<p data-i18n="ic_intro">
				Rubik küplerini ve farklı twisty puzzle türlerini
				videolarla adım adım öğren. Başlangıç seviyesinden ileri
				seviyeye kadar tüm video eğitimlerine buradan ulaş.
			</p>

		</section>

		<!-- ======================================================
     KARTLAR
		====================================================== -->

		<section class="vt">
			<div class="vt-tabs" role="tablist"><button type="button" class="vt-tab" data-v="3x3">3×3</button><button type="button" class="vt-tab" data-v="2x2">2×2</button><button type="button" class="vt-tab" data-v="4x4">4×4</button><button type="button" class="vt-tab" data-v="5x5">5×5</button><button type="button" class="vt-tab" data-v="6x6">6×6</button><button type="button" class="vt-tab" data-v="7x7">7×7</button><button type="button" class="vt-tab" data-v="3x3onehand">Tek el</button><button type="button" class="vt-tab" data-v="pyraminx">Pyraminx</button><button type="button" class="vt-tab" data-v="skewb">Skewb</button><button type="button" class="vt-tab" data-v="square1">Square-1</button><button type="button" class="vt-tab" data-v="megaminx">Megaminx</button><button type="button" class="vt-tab" data-v="clock">Clock</button><button type="button" class="vt-tab" data-v="fto">FTO</button></div>
			<div class="vt-panel" id="vtPanel"></div>
		</section>
		<script>
		(function(){
			var D={"3x3":["3×3","3×3'ü sıfırdan öğren; başlangıç yönteminden CFOP'a kadar."],"2x2":["2×2","Ortega ve CLL ile hızlı 2×2 çözümü."],"4x4":["4×4","Merkezler, kenar eşleme ve parity."],"5x5":["5×5","Büyük küplerde reduction yöntemi."],"6x6":["6×6","6×6 için merkez ve kenar düzeni."],"7x7":["7×7","7×7'de uzun çözümleri düzenli yürüt."],"3x3onehand":["Tek el","3×3'ü tek elle çözmek için parmak hareketleri."],"pyraminx":["Pyraminx","Uçlar, merkezler ve L4E."],"skewb":["Skewb","Skewb için basit ve hızlı yöntemler."],"square1":["Square-1","Şekil, parity ve Square-1 çözümü."],"megaminx":["Megaminx","12 yüzlü bulmacayı katman katman çöz."],"clock":["Clock","Rubik's Clock için 7-simul ve teknikler."],"fto":["FTO","Face-Turning Octahedron'a giriş."]};
			var tabs=document.querySelectorAll(".vt-tab"),panel=document.getElementById("vtPanel");
			function show(id){ if(!D[id]) id="3x3";
				tabs.forEach(function(b){ b.classList.toggle("on",b.getAttribute("data-v")===id); b.setAttribute("aria-selected",b.getAttribute("data-v")===id); });
				panel.innerHTML='<h2>'+D[id][0]+' videoları</h2><p>'+D[id][1]+'</p><p class="vt-soon">Videolar hazırlanıyor. Yeni videolar önce YouTube kanalımızda yayınlanıyor.</p><a class="vt-yt" href="https://www.youtube.com/@rubikacademyy" target="_blank" rel="noopener">YouTube kanalına git →</a>';
				var on=document.querySelector(".vt-tab.on"); if(on) on.parentNode.scrollLeft=on.offsetLeft-on.parentNode.offsetLeft-20;
				if(location.hash.slice(1)!==id) history.replaceState(null,"","#"+id);
			}
			tabs.forEach(function(b){ b.onclick=function(){ show(b.getAttribute("data-v")); }; });
			show(location.hash.slice(1));
		})();
		</script>
