// Rubik Academy Android uygulaması: siteyi (rubikacademy.fun) tam ekran açan Trusted Web Activity.
// Sürüm OTOMATİK: GitHub Actions her derlemede RA_VERSION_CODE verir (çalışma numarası + 10). Elle değiştirme.
plugins { id "com.android.application" }

android {
    namespace "fun.rubikacademy.app"
    compileSdk 36

    defaultConfig {
        applicationId "fun.rubikacademy.app"
        minSdk 23
        targetSdk 36
        def vc = (System.getenv("RA_VERSION_CODE") ?: "4") as int
        versionCode vc
        versionName "1.2." + vc
    }
    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint { checkReleaseBuilds false; abortOnError false }
}

dependencies {
    implementation "com.google.androidbrowserhelper:androidbrowserhelper:2.5.0"
}
