// Rubik Academy Android uygulaması: siteyi (rubikacademy.fun) tam ekran açan Trusted Web Activity.
// Sürüm yükseltmek için versionCode'u 1 artır, versionName'i değiştir.
plugins { id "com.android.application" }

android {
    namespace "fun.rubikacademy.app"
    compileSdk 36

    defaultConfig {
        applicationId "fun.rubikacademy.app"
        minSdk 23
        targetSdk 36
        versionCode 1
        versionName "1.0.0"
    }
    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint { checkReleaseBuilds false; abortOnError false }
}

dependencies {
    implementation "com.google.androidbrowserhelper:androidbrowserhelper:2.5.0"
}
