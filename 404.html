<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- THEME AND SEO SETTINGS -->
<script>
  (function() {
    var savedTheme = localStorage.getItem("theme");
    if (savedTheme === "dark") {
      document.documentElement.classList.add("dark-mode");
    }
  })();
</script>

<title>Rubik Academy - Page Not Found (404)</title>
<link rel="icon" href="/RubikAcademyLogoBlack-Photoroom.png" type="image/png">
<link rel="canonical" href="https://rubikacademy.fun/404">
<meta name="description" content="The page you are looking for could not be found. Return to the Rubik Academy homepage to continue your cube learning journey.">
<meta property="og:title" content="Rubik Academy - 404 Page Not Found">
<meta property="og:description" content="The page you are looking for could not be found. Return to the Rubik Academy homepage!">
<meta property="og:type" content="website">
<meta property="og:url" content="https://rubikacademy.fun/404">
<meta property="og:image" content="https://rubikacademy.fun/RubikAcademyLogoBlack-Photoroom.png">
<meta name="twitter:card" content="summary_large_image">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
:root {
    --background: #f8fafc; --surface: #ffffff; --surface-soft: #f1f5f9;
    --primary: #2563eb; --primary-dark: #1d4ed8; --primary-light: #eff6ff;
    --text: #172033; --text-soft: #64748b; --border: #e2e8f0;
    --shadow: 0 15px 40px rgba(15, 23, 42, 0.07);
}

html.dark-mode, body.dark-mode {
    --background: #0f172a; --surface: #1e293b; --surface-soft: #334155;
    --text: #f8fafc; --text-soft: #cbd5e1; --border: #334155;
    --primary-light: #1e3a8a; --primary: #3b82f6;
    --shadow: 0 15px 40px rgba(0, 0, 0, 0.30);
}

* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: "Inter", sans-serif;
    background: var(--background);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    transition: background-color 0.3s ease, color 0.3s ease;
}

.error-card {
    width: 100%;
    max-width: 480px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 48px 36px;
    text-align: center;
    box-shadow: var(--shadow);
    transition: background-color 0.3s ease, border-color 0.3s ease;
}

.error-badge {
    display: inline-block;
    background: var(--primary-light);
    color: var(--primary);
    font-size: 13px;
    font-weight: 700;
    padding: 6px 14px;
    border-radius: 20px;
    margin-bottom: 20px;
    letter-spacing: 0.5px;
}

.error-title {
    font-size: 26px;
    font-weight: 800;
    letter-spacing: -0.5px;
    margin-bottom: 12px;
    color: var(--text);
}

.error-desc {
    font-size: 15px;
    color: var(--text-soft);
    line-height: 1.6;
    margin-bottom: 32px;
}

.home-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: var(--primary);
    color: #ffffff;
    font-size: 15px;
    font-weight: 600;
    padding: 14px 28px;
    border-radius: 14px;
    box-shadow: 0 8px 20px rgba(37, 99, 235, 0.25);
    transition: all 0.25s ease;
    text-decoration: none;
}

.home-btn:hover {
    background: var(--primary-dark);
    transform: translateY(-2px);
    box-shadow: 0 12px 24px rgba(37, 99, 235, 0.35);
}
</style>
</head>
<body>

<div class="error-card">
    <div class="error-badge">ERROR 404</div>
    <h1 class="error-title">Page Not Found</h1>
    <p class="error-desc">The page you are looking for might have been moved, deleted, or never existed. Return to the homepage to keep solving cubes.</p>
    <a href="/" class="home-btn">Back to Home</a>
</div>

</body>
</html>
