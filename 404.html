<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- TEMA VE SEO AYARLARI -->
<script>
  (function() {
    var savedTheme = localStorage.getItem("theme");
    if (savedTheme === "dark") {
      document.documentElement.classList.add("dark-mode");
    }
  })();
</script>

<title>Rubik Academy - Sayfa Bulunamadı (404)</title>
<link rel="icon" href="/RubikAcademyLogoBlack-Photoroom.png" type="image/png">
<link rel="canonical" href="https://rubikacademy.fun/404">
<meta name="description" content="Aradığınız sayfa bulunamadı. Rubik Academy ana sayfasına dönerek küp eğitimlerine devam edebilirsiniz.">
<meta property="og:title" content="Rubik Academy - 404 Sayfa Bulunamadı">
<meta property="og:description" content="Aradığınız sayfa bulunamadı. Rubik Academy ana sayfasına geri dönün!">
<meta property="og:type" content="website">
<meta property="og:url" content="https://rubikacademy.fun/404">
<meta property="og:image" content="https://rubikacademy.fun/RubikAcademyLogoBlack-Photoroom.png">
<meta name="twitter:card" content="summary_large_image">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
:root {
    --background: #f8fafc; --surface: #ffffff; --surface-soft: #f1f5f9;
    --primary: #2563eb; --primary-dark: #1d4ed8; --primary-light: #eff6ff;
    --text: #172033; --text-soft: #64748b; --border: #e2e8f0;
}

html.dark-mode, body.dark-mode {
    --background: #0f172a; --surface: #1e293b; --surface-soft: #334155;
    --text: #f8fafc; --text-soft: #cbd5e1; --border: #334155;
    --primary-light: #1e3a8a; --primary: #3b82f6;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: "Inter", sans-serif;
    background: var(--background);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    transition: background-color 0.3s, color 0.3s;
}

.error-container {
    text-align: center;
    max-width: 500px;
    background: var(--surface);
    padding: 50px 30px;
    border-radius: 24px;
    border: 1px solid var(--border);
    box-shadow: 0 20px 40px rgba(0,0,0,0.05);
}

.error-code {
    font-size: 96px;
    font-weight: 900;
    color: var(--primary);
    line-height: 1;
    margin-bottom: 20px;
    letter-spacing: -2px;
}

.error-title {
    font-size: 24px;
    font-weight: 700;
    margin-bottom: 12px;
}

.error-desc {
    font-size: 15px;
    color: var(--text-soft);
    line-height: 1.6;
    margin-bottom: 30px;
}

.home-btn {
    display: inline-block;
    background: var(--primary);
    color: white;
    font-weight: 600;
    padding: 12px 28px;
    border-radius: 12px;
    transition: 0.25s ease;
}

.home-btn:hover {
    background: var(--primary-dark);
    transform: translateY(-2px);
}
</style>
</head>
<body>

<div class="error-container">
    <div class="error-code">404</div>
    <h1 class="error-title">Sayfa Bulunamadı</h1>
    <p class="error-desc">Aradığınız sayfa kaldırılmış, adı değiştirilmiş veya hiç var olmamış olabilir. Yanlış bir bağlantıya tıklamış olabilirsiniz.</p>
    <a href="/" class="home-btn">Ana Sayfaya Dön</a>
</div>

</body>
</html>
