<head>

  (function() {
    var savedTheme = localStorage.getItem("theme");

      document.documentElement.classList.add("dark-mode");
    }
  })();

<title>Rubik Academy - Page Not Found (404)</title>
<link rel="icon" href="/icons/favicon-48.png" type="image/png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">

<link rel="canonical" href="https://rubikacademy.fun/404">
<meta name="description" content="The page you are looking for could not be found. Return to the Rubik Academy homepage to continue your cube learning journey.">
<meta property="og:title" content="Rubik Academy - 404 Page Not Found">
<meta property="og:description" content="The page you are looking for could not be found. Return to the Rubik Academy homepage!">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<link rel="stylesheet" href="/styles/common.css?v=20261068">

<style>
body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
}

.error-card {
    width: 100%;
    max-width: 480px;
    background: var(--surface);
    border: var(--card-bw) solid var(--card-border);
    border-radius: 26px;
    padding: 44px 36px;
    text-align: center;
    box-shadow: var(--shadow);
}

/* "404" üstünde küp renklerinden mini şerit */
.error-card::before {
    content: "";
    display: block;
    width: 120px;
    height: 10px;
    margin: 0 auto 24px;
    border-radius: 5px;
    border: var(--card-bw) solid var(--ink);
    background: linear-gradient(90deg,
        var(--cube-red) 0 20%,
        var(--cube-orange) 20% 40%,
        var(--cube-yellow) 40% 60%,
        var(--cube-green) 60% 80%,
        var(--cube-blue) 80% 100%);
}

.error-badge {
    display: inline-block;
    background: var(--cube-yellow);
    border: var(--card-bw) solid var(--ink);
    color: #17171f;
    font-size: 13px;
    font-weight: 900;
    padding: 6px 14px;
    border-radius: 10px;
    margin-bottom: 20px;
    letter-spacing: 1px;
}

.error-title {
    font-family: var(--font-display);
    font-size: 30px;
    font-weight: 800;
    letter-spacing: -0.5px;
    margin-bottom: 12px;
    color: var(--text);
}

.error-desc {
    font-size: 15px;
    color: var(--text-soft);
    line-height: 1.6;
    margin-bottom: 30px;
}

.home-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: var(--cube-yellow);
    color: #17171f;
    border: var(--card-bw) solid var(--ink);
    font-size: 15px;
    font-weight: 800;
    padding: 14px 28px;
    border-radius: 14px;
    box-shadow: var(--shadow);
    transition: transform .15s ease, box-shadow .15s ease;
    text-decoration: none;
}

.home-btn:hover {
    transform: translate(-2px, -2px);
    box-shadow: 7px 7px 0 var(--ink);
}

.home-btn:active {
    transform: translate(3px, 3px);
    box-shadow: 2px 2px 0 var(--ink);
}
</style>
</head>
<body>

<div class="error-card">
    <div class="error-badge" data-i18n="nf_badge">ERROR 404</div>
    <h1 class="error-title" data-i18n="nf_title">Page Not Found</h1>
    <p class="error-desc" data-i18n="nf_desc">The page you are looking for might have been moved, deleted, or never existed. Return to the homepage to keep solving cubes.</p>
    <a href="/" class="home-btn" data-i18n="nf_btn">Back to Home</a>
</div>

<!-- ÇEVİRİLER: /js/i18n.js içinde (PAGE_ID ile eşleşir).
     Bu sayfa common.js kullanmaz; dil, diğer sayfalarda seçilip localStorage'a
     kaydedilen "site-lang" değerinden okunur. i18n.js yüklenemezse
     sayfadaki İngilizce metinler olduğu gibi kalır. -->
<script>var PAGE_ID = "notfound";</script>
<script src="/js/i18n.js?v=20261068"></script>
<script>
(function () {
    var lang = "en"; /* sitenin varsayılan dili; kayıtlı dil yoksa bu kullanılır */
    try { lang = localStorage.getItem("site-lang") || lang; } catch (e) {}

    var pages = window.SITE_I18N && SITE_I18N.pages;
    var t = pages && pages[PAGE_ID] && pages[PAGE_ID][lang];
    if (!t) return; /* çeviri yoksa İngilizce kalır */

    document.querySelectorAll("[data-i18n]").forEach(function (el) {
        var key = el.getAttribute("data-i18n");
        if (t[key] !== undefined) el.textContent = t[key];
    });

    if (t.nf_pageTitle) document.title = t.nf_pageTitle;
    document.documentElement.setAttribute("lang", lang);
    document.documentElement.setAttribute("dir", lang === "ar" ? "rtl" : "ltr");
})();
</script>

</body>
</html>
