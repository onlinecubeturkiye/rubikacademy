<style>
.auth-wrap { max-width: 440px; margin: 0 auto; }
.auth-card { background: var(--surface); border: var(--card-bw) solid var(--card-border); border-radius: 24px; box-shadow: var(--shadow); padding: 26px 26px 22px; }
.auth-head { text-align: center; margin-bottom: 18px; }
.auth-head h1 { font-size: 26px; font-weight: 900; color: var(--text); letter-spacing: -.5px; }
.auth-head p { color: var(--text-soft); font-size: 14px; line-height: 1.6; margin-top: 6px; }
.auth-tabs { display: flex; gap: 6px; background: var(--surface-soft); border-radius: 14px; padding: 5px; margin-bottom: 18px; }
.auth-tab { flex: 1; padding: 10px; border: 0; border-radius: 10px; background: transparent; color: var(--text-soft); font: 800 14.5px Inter, sans-serif; cursor: pointer; }
.auth-tab.on { background: var(--surface); color: var(--text); box-shadow: var(--shadow-sm); }
.auth-google { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; padding: 12px; border-radius: 13px; border: var(--card-bw) solid var(--ink); background: var(--surface); color: var(--text); font: 800 15px Inter, sans-serif; cursor: pointer; box-shadow: var(--shadow-sm); }
.auth-google:hover { background: var(--surface-soft); }
.auth-or { display: flex; align-items: center; gap: 10px; color: var(--text-soft); font-size: 12.5px; font-weight: 700; margin: 16px 0; }
.auth-or::before, .auth-or::after { content: ""; flex: 1; height: 1px; background: var(--border); }
.auth-form { display: grid; gap: 10px; }
.auth-in { width: 100%; box-sizing: border-box; padding: 13px 14px; border-radius: 13px; border: var(--card-bw) solid var(--ink); background: var(--surface); color: var(--text); font: 600 15px Inter, sans-serif; }
.auth-in:focus { outline: 2px solid var(--ui-accent); }
.auth-submit { width: 100%; padding: 13px; border-radius: 13px; border: var(--card-bw) solid var(--ink); background: var(--ui-accent); color: var(--ui-accent-text); font: 900 15.5px Inter, sans-serif; cursor: pointer; box-shadow: var(--shadow-sm); }
.auth-submit:hover { transform: translate(-1px,-1px); }
.auth-submit:disabled, .auth-google:disabled { opacity: .55; cursor: default; }
.auth-forgot { background: 0; border: 0; color: var(--text-soft); font: 700 13px Inter, sans-serif; cursor: pointer; text-decoration: underline; justify-self: center; margin-top: 2px; }
.auth-err { min-height: 18px; font-size: 13px; font-weight: 700; color: var(--cube-red); text-align: center; }
.auth-err.ok { color: var(--cube-green); }
.auth-priv { color: var(--text-soft); font-size: 12px; text-align: center; margin-top: 14px; line-height: 1.5; }
.auth-priv a { color: var(--primary); }
</style>
</head>
<body>
<div class="bg-glow"></div>
<header class="navbar">
    <a href="/" class="nav-logo"><img class="nav-logo-mark" src="/RubikAcademyLogo.png" alt="Rubik Academy"><span class="nav-logo-text">Rubik Academy</span></a>
    <div class="nav-right">
        <nav class="nav-links"><a href="/" data-i18n="navHome">Ana Sayfa</a><a href="/icerikler" data-i18n="navContent">İçerikler</a></nav>
    </div>
</header>
<div class="page">
<div class="auth-wrap">
<nav class="nav-bar"><a href="/" class="back-btn" data-i18n="back_btn">← Ana Sayfa</a></nav>
<div class="auth-card">
    <div class="auth-head"><h1 id="aTitle">Giriş yap</h1><p id="aWhy"></p></div>
    <div class="auth-tabs"><button type="button" class="auth-tab on" id="tabLogin"></button><button type="button" class="auth-tab" id="tabSignup"></button></div>
    <button type="button" class="auth-google" id="gBtn">
        <svg viewBox="0 0 48 48" width="20" height="20" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.2-.1-2.3-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.2-.1-2.3-.4-3.5z"/></svg>
        <span id="gTxt">Google ile devam et</span>
    </button>
    <div class="auth-or"><span id="orTxt">veya</span></div>
    <form class="auth-form" id="aForm" novalidate>
        <input type="text" class="auth-in" id="aName" autocomplete="nickname" maxlength="20" hidden>
        <input type="email" class="auth-in" id="aEmail" autocomplete="email" required>
        <input type="password" class="auth-in" id="aPass" autocomplete="current-password" minlength="6" required>
        <p class="auth-err" id="aErr" role="alert"></p>
        <button type="submit" class="auth-submit" id="aSubmit"></button>
        <button type="button" class="auth-forgot" id="aForgot"></button>
    </form>
    <p class="auth-priv" id="aPriv"></p>
</div>
</div>
</div>
<footer><span data-i18n="footer">© 2026 Rubik Academy. Tüm hakları saklıdır.</span></footer>
<script src="/js/i18n.js?v=20261153"></script>
<script src="/js/common.js?v=20261153"></script>
<script src="/js/firebase-config.js?v=20261153"></script>
<script src="/js/account.js?v=20261153"></script>
<script>
(function () {
    function $(id) { return document.getElementById(id); }
    var A = window.Account;
    // Dönüş adresi (yalnızca aynı site yolu kabul edilir)
    function returnUrl() {
        try { var r = new URLSearchParams(location.search).get("return"); if (r && /^\/[^/]/.test(r)) return r; } catch (e) {}
        return "/icerikler/profil";
    }
    var mode = (new URLSearchParams(location.search).get("mod") === "signup") ? "signup" : "login";
    if (!A || !A.enabled()) { $("aErr").textContent = "Hesap sistemi şu an kullanılamıyor."; return; }
    // Zaten girişliyse doğrudan yönlendir
    A.onChange(function (u) { if (u) location.replace(returnUrl()); });

    function T(k) { return A.txt(k); }
    function render() {
        $("tabLogin").textContent = T("login_t"); $("tabSignup").textContent = T("signup_t");
        $("tabLogin").classList.toggle("on", mode === "login"); $("tabSignup").classList.toggle("on", mode === "signup");
        $("aTitle").textContent = T(mode === "login" ? "login_t" : "signup_t");
        $("aWhy").textContent = T("why");
        $("gTxt").textContent = T("google"); $("orTxt").textContent = T("or");
        $("aName").hidden = mode !== "signup"; $("aName").placeholder = T("name");
        $("aEmail").placeholder = T("email"); $("aPass").placeholder = T("pass");
        $("aPass").autocomplete = mode === "signup" ? "new-password" : "current-password";
        $("aSubmit").textContent = T(mode === "login" ? "do_login" : "do_signup");
        $("aForgot").textContent = T("forgot"); $("aForgot").hidden = mode !== "login";
        $("aPriv").innerHTML = T("privacy");
    }
    function err(m, ok) { var e = $("aErr"); e.textContent = m || ""; e.classList.toggle("ok", !!ok); }
    function busy(b) { $("aSubmit").disabled = b; $("gBtn").disabled = b; }
    $("tabLogin").onclick = function () { mode = "login"; err(""); render(); };
    $("tabSignup").onclick = function () { mode = "signup"; err(""); render(); };
    $("gBtn").onclick = function () {
        err(""); busy(true);
        A.googleSignIn().catch(function (e) {
            if (e && /popup-closed-by-user|cancelled-popup-request/.test(e.code || "")) return;
            err(e && e.code ? A.errText(e) : T("e_load"));
        }).then(function () { busy(false); });
    };
    $("aForm").onsubmit = function (e) {
        e.preventDefault();
        var email = $("aEmail").value.trim(), pass = $("aPass").value, name = $("aName").value.replace(/\s+/g, " ").trim();
        if (mode === "signup" && (name.length < 2 || name.length > 20)) { err(T("e_name")); return; }
        err(""); busy(true);
        A.emailAuth(mode, email, pass, name).catch(function (er) { err(er && er.code ? A.errText(er) : T("e_load")); }).then(function () { busy(false); });
    };
    $("aForgot").onclick = function () {
        var email = $("aEmail").value.trim();
        if (!email) { err(T("need_email")); $("aEmail").focus(); return; }
        busy(true);
        A.resetPassword(email).then(function () { err(T("reset_sent"), true); }, function (er) { err(A.errText(er)); }).then(function () { busy(false); });
    };
    document.addEventListener("site-lang-change", render);
    render();
})();
</script>
</body>
</html>
