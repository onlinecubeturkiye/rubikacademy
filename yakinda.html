<style>
/* =========================================
   SAYFAYA ÖZEL DEĞİŞKENLER
========================================= */
:root {
    --badge-bg: #edf7ff;
    --badge-border: #cfe8ff;
    --badge-text: #1682d4;
    --h1-color: #152238;
}

html.dark-mode,
body.dark-mode {
    --badge-bg: #1e3a8a;
    --badge-border: #1d4ed8;
    --badge-text: #60a5fa;
    --h1-color: #f8fafc;
}

/* =========================================
   SAYFA DÜZENİ & ÇOK YAKINDA KARTI
========================================= */
.page {
    min-height: calc(100vh - 71px);
    padding: 40px 5% 60px;
    display: flex;
    flex-direction: column;
    align-items: center;
    background: var(--background);
    transition: background-color 0.3s;
}

/* NAV / GERİ DÖN */
.nav-bar {
    width: 100%;
    max-width: 850px;
    margin-bottom: 30px;
}

.back-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 11px 20px;
    border-radius: 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--primary);
    font-size: 13px;
    font-weight: 800;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.04);
    transition: all .25s ease;
}

.back-btn:hover {
    transform: translateX(-4px);
    border-color: #c0e0fc;
    background: var(--primary-light);
}

/* YAKINDA KART KUTUSU */
.coming-soon-card {
    width: 100%;
    max-width: 850px;
    background: var(--surface);
    border-radius: 32px;
    border: 1px solid var(--card-border);
    padding: 60px 40px;
    text-align: center;
    box-shadow: var(--shadow);
    position: relative;
    overflow: hidden;
    transition: background-color 0.3s, border-color 0.3s;
}

.coming-soon-card::before {
    content: "";
    position: absolute;
    width: 300px;
    height: 300px;
    border-radius: 50%;
    border: 45px solid rgba(255, 255, 255, 0.05);
    top: -150px;
    right: -100px;
    z-index: 1;
}

.content-wrap {
    position: relative;
    z-index: 2;
}

/* BADGE */
.badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 8px 16px;
    border-radius: 50px;
    background: var(--badge-bg);
    border: 1px solid var(--badge-border);
    color: var(--badge-text);
    font-size: 11px;
    font-weight: 900;
    letter-spacing: 1.5px;
    margin-bottom: 25px;
}

.badge i {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #20a4f3;
}

/* YAKINDA ICON */
.icon-wrap {
    width: 160px;
    height: 160px;
    margin: 0 auto 30px;
    filter: drop-shadow(0 15px 20px rgba(0, 0, 0, 0.15));
    animation: floating 4s ease-in-out infinite;
}

@keyframes floating {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
}

.coming-soon-card h1 {
    font-size: clamp(32px, 4vw, 48px);
    font-weight: 950;
    letter-spacing: -1.5px;
    color: var(--h1-color);
    margin-bottom: 15px;
}

.coming-soon-card h1 span {
    color: var(--primary);
}

.coming-soon-card p {
    font-size: 15px;
    line-height: 1.7;
    color: var(--text-soft);
    max-width: 540px;
    margin: 0 auto 35px;
}

.action-btn {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 14px 28px;
    border-radius: 14px;
    background: var(--primary);
    color: #ffffff;
    font-size: 13px;
    font-weight: 800;
    box-shadow: 0 10px 25px rgba(37, 99, 235, 0.3);
    transition: all .25s ease;
}

.action-btn:hover {
    background: var(--primary-dark);
    transform: translateY(-2px);
    box-shadow: 0 14px 30px rgba(37, 99, 235, 0.4);
}

@media(max-width: 600px) {
    .coming-soon-card { padding: 40px 20px; }
    .icon-wrap { width: 130px; height: 130px; }
}
