<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profilim - Rubik Academy</title>
    <link rel="icon" href="/RubikAcademyLogoBlack-Photoroom.png" type="image/png">
    <style>
        /* CSS'i önceki sayfalarla aynı mantıkta hazırladık, 
           buraya yapıştırıp üzerine eklemeler yapabilirsin */
        :root { --background: #f8fbff; --surface: #ffffff; --text: #172033; --primary: #2563eb; }
        html.dark-mode { --background: #0f172a; --surface: #1e293b; --text: #f8fafc; }
        
        body { font-family: 'Inter', sans-serif; background: var(--background); color: var(--text); padding: 40px 20px; transition: 0.3s; }
        .container { max-width: 600px; margin: 0 auto; text-align: center; }
        .profile-card { background: var(--surface); padding: 40px; border-radius: 24px; border: 1px solid var(--border); box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        .avatar { width: 100px; height: 100px; background: var(--primary); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 40px; margin: 0 auto 20px; font-weight: bold; }
        .btn-exit { margin-top: 20px; padding: 10px 20px; background: #ef4444; color: white; border: none; border-radius: 10px; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <div class="profile-card">
        <div class="avatar" id="userInitial">?</div>
        <h2 id="userName">Yükleniyor...</h2>
        <p id="userEmail">Yükleniyor...</p>
        <button class="btn-exit" id="logoutBtn">Çıkış Yap</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCjWur-uR2_n9uSrTxmbCJxCJiPyIxcsM",
      authDomain: "rubik-academy-fba3c.firebaseapp.com",
      projectId: "rubik-academy-fba3c",
      storageBucket: "rubik-academy-fba3c.firebasestorage.app",
      messagingSenderId: "1023711507891",
      appId: "1:1023711507891:web:32deb9055e5bdacbb007c6"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // Giriş kontrolü: Eğer giriş yapmamışsa giriş sayfasına at
    onAuthStateChanged(auth, (user) => {
        if (user) {
            document.getElementById("userName").innerText = user.displayName;
            document.getElementById("userEmail").innerText = user.email;
            document.getElementById("userInitial").innerText = user.displayName.charAt(0).toUpperCase();
        } else {
            window.location.href = "/giris.html";
        }
    });

    // Çıkış yapma
    document.getElementById("logoutBtn").addEventListener("click", () => {
        signOut(auth).then(() => {
            window.location.href = "/giris.html";
        });
    });
</script>

</body>
</html>
